<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopBar · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Application frame</p>
<h1 style="margin:0 0 4px;font-size:20px">TopBar</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Top bar slots: organisation, context, search, help, account; wraps on narrow widths · Guidelines: <code>src/shell/TopBar/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const C = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 'var(--font-size-label)', lineHeight: 'var(--line-height-label)', color: 'var(--ink-muted)' } }, t);
const frame = (w, hgt, child) => h('div', { style: { position: 'relative', maxWidth: w, height: hgt, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface)' } }, child);

const bar = () => h(C.TopBar, {
  brand: 'Riverside Mental Health',
  context: h('span', { style: { color: 'var(--ink-muted)' } }, 'Acute team, Clinician'),
  help: h(C.MenuButton, { label: 'Help', icon: 'help', iconOnly: true, variant: 'quiet', items: [{ id: 'g', label: 'Guide' }] }),
  account: h(C.MenuButton, { label: 'Ana Silva', variant: 'quiet', align: 'end', items: [{ id: 'o', label: 'Sign out' }] }),
});
ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  label('Desktop'), h('div', { style: { maxWidth: 1160 } }, bar()),
  label('Phone width: the context takes its own line'), h('div', { style: { maxWidth: 360 } }, bar())
));
</script>

</div>
</body>
</html>
