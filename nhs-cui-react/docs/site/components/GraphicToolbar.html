<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphicToolbar · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">GraphicToolbar</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Graphic toolbar: grouped tools with labels and tooltips, undo, redo, remove all · Guidelines: <code>src/noting/GraphicToolbar/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { GraphicToolbar, DEFAULT_GRAPHIC_SYMBOLS } = window.ClinicalCUI;
function Demo() {
  const [tool, setTool] = React.useState('symbol:x');
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
    h(GraphicToolbar, { tool: tool, onToolChange: setTool, symbols: DEFAULT_GRAPHIC_SYMBOLS, canUndo: true, canRedo: false, onUndo: function () {}, onRedo: function () {}, onDeleteSelected: function () {}, canDeleteSelected: true, onRemoveAll: function () {}, canRemoveAll: true, emphasis: { bold: true, underline: false, enabled: true }, onToggleEmphasis: function () {}, onRemoveModule: function () {} }),
    h(GraphicToolbar, { tool: 'select', onToolChange: function () {}, symbols: DEFAULT_GRAPHIC_SYMBOLS.slice(0, 1), canUndo: false, canRedo: false, onUndo: function () {}, onRedo: function () {}, onRemoveAll: function () {}, canRemoveAll: false })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
