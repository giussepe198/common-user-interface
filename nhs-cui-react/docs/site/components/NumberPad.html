<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NumberPad · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">NumberPad</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Number pad: 60 px keys, value with unit and previous value; integer and decimal · Guidelines: <code>src/touch/NumberPad/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { NumberPad } = window.ClinicalCUI;
const cap = t => h('p', { className: 'cui-label', style: { margin: '12px 0 4px' } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390 } },
    cap('Decimal allowed (temperature)'),
    h(NumberPad, { label: 'Temperature', unit: '°C', allowDecimal: true, maxDecimals: 1, defaultValue: '37.8', previous: 'Previous 37.2 °C at 09:55' }),
    cap('Whole numbers only: the point is disabled; empty value'),
    h(NumberPad, { label: 'Heart rate', unit: 'beats/min', labelSize: 'normal' })
  )
);
</script>

</div>
</body>
</html>
