<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConceptFlyout · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Terminology</p>
<h1 style="margin:0 0 4px;font-size:20px">ConceptFlyout</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Concept details: full name, synonym, parents, more specific concepts; AU edition, NZ te reo consumer term · Guidelines: <code>src/noting/ConceptFlyout/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ConceptFlyout, ClinicalLocaleProvider, SNOMED_EDITIONS } = window.ClinicalCUI;
const MI = SNOMED_EDITIONS.NZ.consumerRefsets[0].id;
const NZC = SNOMED_EDITIONS.NZ.consumerRefsets[1].id;
const label = (t, el) => h('div', null, h('p', { style: { margin: '0 0 6px', fontSize: 12, fontWeight: 600, color: 'var(--ink-muted)' } }, t), el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(ConceptFlyout, { concept: { term: 'Heart attack', fsn: 'Myocardial infarction (disorder)', isSynonym: true, preferredTerm: 'Myocardial infarction', parents: ['Ischaemic heart disease', 'Myocardial necrosis'], moreSpecific: ['Acute myocardial infarction', 'Old myocardial infarction', 'Silent myocardial infarction'] }, onBrowseRelated: function () {} }),
    h(ConceptFlyout, { modifier: 'knownAbsent', concept: { term: 'Gastroenteritis', fsn: 'Gastroenteritis (disorder)', parents: ['Disorder of digestive system'] }, onBrowseRelated: function () {} }),
    h(ConceptFlyout, { concept: { term: 'SLE - Systemic lupus erythematosus', fsn: 'Systemic lupus erythematosus (disorder)', parents: ['Autoimmune disease'] } }),
    label('AU: edition shown', h(ClinicalLocaleProvider, { region: 'AU' }, h(ConceptFlyout, { edition: SNOMED_EDITIONS.AU.label, concept: { term: 'Paracetamol poisoning', fsn: 'Poisoning caused by paracetamol (disorder)', parents: ['Poisoning caused by analgesic'] } }))),
    label('NZ with te reo labels: consumer terms', h(ClinicalLocaleProvider, { region: 'NZ', teReoLabels: true }, h(ConceptFlyout, { edition: SNOMED_EDITIONS.NZ.label, concept: { term: 'Diabetes mellitus', fsn: 'Diabetes mellitus (disorder)', parents: ['Disorder of glucose metabolism'], descriptions: [
      { term: 'Diabetes', type: 'synonym', acceptability: { [NZC]: 'preferred' } },
      { term: 'Mate huka', type: 'synonym', lang: 'mi', acceptability: { [MI]: 'preferred' } }] } })))
  )
);
</script>

</div>
</body>
</html>
