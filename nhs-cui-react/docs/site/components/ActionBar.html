<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ActionBar · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">ActionBar</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Bottom action bar: row with primary on the right, stack with summary, three actions · Guidelines: <code>src/touch/ActionBar/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ActionBar } = window.ClinicalCUI;
const cap = t => h('p', { className: 'cui-label', style: { margin: '12px 0 4px' } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390 } },
    cap('Row: Cancel and the primary action on the right (B3)'),
    h(ActionBar, { sticky: false, actions: [
      { label: 'Record W: Withheld', variant: 'primary' },
      { label: 'Cancel' }
    ] }),
    cap('Stack with summary line (P1)'),
    h(ActionBar, { sticky: false, layout: 'stack', summary: h('span', null, 'Mon 26-Oct-2026 ', h('strong', null, 'Approx 21:30')), actions: [
      { label: 'Use this date and time', variant: 'primary' }
    ] }),
    cap('Three actions'),
    h(ActionBar, { sticky: false, size: 48, actions: [
      { label: 'Previous', icon: 'chevron-left' },
      { label: 'Skip' },
      { label: 'Save', variant: 'primary' }
    ] })
  )
);
</script>

</div>
</body>
</html>
