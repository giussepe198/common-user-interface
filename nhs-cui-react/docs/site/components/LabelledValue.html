<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelledValue · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">LabelledValue</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Label and value pair with definition tooltip · Guidelines: <code>src/patient/LabelledValue/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { LabelledValue } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, padding: 12, background: 'var(--surface)' } },
    h('div', { style: { display: 'flex', gap: 32, flexWrap: 'wrap' } },
      h(LabelledValue, { label: 'Born', value: '14-Jul-1945 (81y)', definition: "The patient's date of birth" }),
      h(LabelledValue, { label: 'NHS No.', value: '999 000 0018', onOpenRecord: () => {} }),
      h(LabelledValue, { label: 'Gender', value: null })
    ),
    h('div', { style: { display: 'flex', gap: 32 } },
      h(LabelledValue, { label: 'Usual address', value: 'Tewkesbury', layout: 'stacked' }),
      h(LabelledValue, { label: 'Mobile', value: '?', layout: 'stacked' })
    )
  )
);
</script>

</div>
</body>
</html>
