<h1 style="margin:0 0 4px;font-size:20px">ShorthandResolver</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Shorthand resolver: possible meanings, none pre-selected · Guidelines: <code>src/noting/ShorthandResolver/README.md</code></p>

<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ShorthandResolver } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(ShorthandResolver, { shorthand: 'MI', resolutions: [{ id: '1', label: 'Myocardial infarction' }, { id: '2', label: 'Mitral incompetence', description: 'Used in cardiology' }, { id: '3', label: 'Mental illness', description: 'Used in mental health' }], onResolve: function () {}, onDismiss: function () {} })
);
</script>
