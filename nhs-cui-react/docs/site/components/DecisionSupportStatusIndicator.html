<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DecisionSupportStatusIndicator · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Decision support</p>
<h1 style="margin:0 0 4px;font-size:20px">DecisionSupportStatusIndicator</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Decision support capability: running fully, not fully running, changed since viewed with the service list · Guidelines: <code>src/administration/DecisionSupportStatusIndicator/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DecisionSupportStatusIndicator } = window.ClinicalCUI;
const at = function (hh, mm) { return new Date(2026, 4, 27, hh, mm); };
const services = [
  { id: 's1', name: 'Licensed use of Drug Checking', state: 'running', since: at(7, 0) },
  { id: 's2', name: 'Drug to Disease Contraindications Checking', state: 'running', since: at(7, 0) },
  { id: 's3', name: 'Dose Calculations', state: 'notRunning', since: at(10, 42) },
  { id: 's4', name: 'Formulary Management', state: 'notRunning', since: at(10, 42) },
  { id: 's5', name: 'Allergy Checking', state: 'running', since: at(7, 0) },
  { id: 's6', name: 'Duplicate Therapy Checking', state: 'unavailable', since: new Date(2026, 0, 12, 10, 42) },
];
const noop = function () {};
const item = function (title, el) {
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 6, alignItems: 'flex-start' } }, h('span', { className: 'cui-label' }, title), el);
};
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20, minHeight: 440 } },
    h('div', { style: { display: 'flex', gap: 32 } },
      item('Running fully', h(DecisionSupportStatusIndicator, { services: services.map(function (s) { return Object.assign({}, s, { state: s.state === 'notRunning' ? 'running' : s.state }); }) })),
      item('Not fully running', h(DecisionSupportStatusIndicator, { services: services }))),
    item('Changed since last viewed, list open, change pop-up beside the title', h(DecisionSupportStatusIndicator, {
      services: services, changedSinceViewed: true, defaultExpanded: true, onOpenHelp: noop, onConfigure: noop,
      notification: { dateTime: at(10, 42), message: 'Dose Calculations and Formulary Management are not running' },
    }))
  )
);
</script>

</div>
</body>
</html>
