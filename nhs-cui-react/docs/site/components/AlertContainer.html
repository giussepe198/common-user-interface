<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlertContainer · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Decision support</p>
<h1 style="margin:0 0 4px;font-size:20px">AlertContainer</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Alert container: High Priority group first, newest first, resizable · Guidelines: <code>src/administration/AlertContainer/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { AlertContainer } = window.ClinicalCUI;
const at = function (hh, mm) { return new Date(2026, 4, 27, hh, mm); };
const link = function (t) { return h('a', { href: '#', onClick: function (e) { e.preventDefault(); } }, t); };
const alerts = [
  { id: 'p1', status: 'Priority', occurredAt: at(8, 5), summary: 'Weight has not been recorded this admission.', source: 'Dose Calculations' },
  { id: 'h1', status: 'High Priority', occurredAt: at(10, 47), source: 'Results Monitoring', summary: h('span', null, 'The ', link('potassium level'), ' is 7.7 mmol/L.'),
    details: { rationale: 'Severe hyperkalaemia can cause cardiac arrhythmias.' },
    actions: [{ id: 'x1', label: 'Repeat potassium urgently', preference: 5, reasons: ['Result much higher than previous'] }, { id: 'x2', label: 'Record an ECG', preference: 4 }] },
  { id: 'p2', status: 'Priority', occurredAt: at(9, 15), summary: 'Creatinine has risen since the last result.', source: 'Results Monitoring' },
  { id: 'h2', status: 'High Priority', occurredAt: at(9, 2), source: 'Drug Interaction Checking', summary: 'Possible interaction between Clarithromycin and Simvastatin.' },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 24, alignItems: 'flex-start' } },
    h(AlertContainer, { alerts: alerts, height: 520, onRecordResponse: function () {}, onDismiss: function () {} }),
    h(AlertContainer, { alerts: [], height: 200, heading: 'Alerts (empty)', resizable: false })
  )
);
</script>

</div>
</body>
</html>
