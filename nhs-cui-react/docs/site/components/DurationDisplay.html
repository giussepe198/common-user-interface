<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DurationDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Dates and times</p>
<h1 style="margin:0 0 4px;font-size:20px">DurationDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Durations with the minimal unit set y m w d hr min sec · Guidelines: <code>src/datetime/DurationDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DurationDisplay } = window.ClinicalCUI;
const row = (label, node) => h('div', { style: { display: 'flex', gap: 16, alignItems: 'baseline', padding: '4px 0' } }, h('span', { className: 'cui-label', style: { width: 190, flex: 'none' } }, label), node);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    row('Hours and minutes', h(DurationDisplay, { value: { hours: 2, minutes: 40 } })),
    row('Mixed units', h(DurationDisplay, { value: { months: 1, days: 2, hours: 3, minutes: 17 } })),
    row('Zero units omitted', h(DurationDisplay, { value: { hours: 8, minutes: 0, seconds: 10 } })),
    row('Approximate', h(DurationDisplay, { value: { hours: 2, minutes: 40 }, approximate: true })),
    row('Missing', h(DurationDisplay, { value: null }))
  )
);
</script>

</div>
</body>
</html>
