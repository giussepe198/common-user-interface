<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpellCheckPopover · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Terminology</p>
<h1 style="margin:0 0 4px;font-size:20px">SpellCheckPopover</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Spelling suggestions with OK, Ignore and Cancel; nothing pre-selected; macrons kept · Guidelines: <code>src/noting/SpellCheckPopover/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SpellCheckPopover } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(SpellCheckPopover, { word: 'pnuemonia', suggestions: [{ text: 'pneumonia', source: 'terminology' }, { text: 'pneumonic', source: 'dictionary' }], onAccept: function () {}, onIgnore: function () {}, onCancel: function () {} }),
    h(SpellCheckPopover, { word: 'whanau', title: 'Check spelling (NZ)', suggestions: [{ text: 'whānau', source: 'dictionary' }], onAccept: function () {}, onIgnore: function () {}, onCancel: function () {} }))
);
</script>

</div>
</body>
</html>
