<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafetyPlan · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">SafetyPlan</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Safety plan: seven sections in the person's words, shared state, numbers, edit mode, empty · Guidelines: <code>src/mental-health/SafetyPlan/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SafetyPlan, EMPTY_SAFETY_PLAN } = window.ClinicalCUI;
const at = '2026-10-20T01:00:00Z';
const e = function (id, text, phone, detail) { return { id: id, text: text, phone: phone, detail: detail, recordedAt: at }; };
const plan = Object.assign({}, EMPTY_SAFETY_PLAN, {
  warningSigns: [e('w1', 'Not sleeping for more than two nights'), e('w2', 'Staying in my room and not answering messages')],
  copingStrategies: [e('c1', 'Walk around the block with music on'), e('c2', 'Cold shower')],
  distraction: [e('d1', 'The library on Main Street'), e('d2', 'Cousin Mai, coffee')],
  helpPeople: [e('h1', 'My sister Linh', '0491570159', 'Any time')],
  professionals: [e('p1', 'Community mental health team', '0255504321', 'Weekdays 09:00 to 17:00'), e('p2', 'Crisis line', '1300975707')],
  environment: [e('m1', 'Ask my sister to keep my medicines')],
  reasonsForLiving: [e('r1', 'My dog'), e('r2', 'Finishing my course')]
});
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 24, padding: 16, background: 'var(--surface)' } },
    h(SafetyPlan, { value: plan, region: 'AU', timeZone: 'Australia/Melbourne', updatedAt: at, updatedBy: 'J Lee', reviewDue: '2027-01-20', sharing: { shared: true, sharedAt: '2026-10-20', how: 'Printed copy given' }, onEdit: function () {}, onPrint: function () {} }),
    h('div', { style: { maxWidth: 380 } }, h(SafetyPlan, { headingLevel: 3, region: 'AU', mode: 'edit', defaultValue: Object.assign({}, EMPTY_SAFETY_PLAN, { helpPeople: plan.helpPeople, warningSigns: plan.warningSigns.slice(0, 1) }), onCancel: function () {}, now: new Date('2026-10-28T03:00:00Z') })),
    h(SafetyPlan, { headingLevel: 3, value: EMPTY_SAFETY_PLAN, onMarkShared: function () {}, onEdit: function () {} })
  )
);
</script>

</div>
</body>
</html>
