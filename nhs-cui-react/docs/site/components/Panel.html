<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Page layout</p>
<h1 style="margin:0 0 4px;font-size:20px">Panel</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Dense card: heading, count, actions, body, footer; collapsible · Guidelines: <code>src/shell/Panel/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const C = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 'var(--font-size-label)', lineHeight: 'var(--line-height-label)', color: 'var(--ink-muted)' } }, t);
const frame = (w, hgt, child) => h('div', { style: { position: 'relative', maxWidth: w, height: hgt, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface)' } }, child);

ReactDOM.createRoot(document.getElementById('root')).render(h(C.Stack, { gap: 3 },
  h(C.Panel, { title: 'Contacts', count: 3, countLabel: '3 contacts', actions: h(C.Button, { size: 'sm', variant: 'quiet', icon: 'plus' }, 'Add contact'), footer: h('a', { href: '#all' }, 'Show all 3') },
    h('p', { style: { margin: 0 } }, 'LEE, Sam, mother, 0400 000 000')),
  h(C.Panel, { title: 'Previous episodes', subtitle: 'Collapsed: count shown', collapsible: true, defaultCollapsed: true, count: 5, countLabel: '5 episodes', countWhenCollapsed: true }, h('p', null, 'Hidden')),
  h(C.Panel, { title: 'Nested group', variant: 'sunken', padding: 'none' }, h(C.EmptyState, { title: 'No items recorded', layout: 'inline' }))
));
</script>

</div>
</body>
</html>
