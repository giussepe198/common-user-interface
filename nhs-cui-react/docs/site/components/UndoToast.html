<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UndoToast · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">UndoToast</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Undo toast: time-limited undo after a commit, pausable, announced politely · Guidelines: <code>src/touch/UndoToast/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { UndoToast, TouchButton } = window.ClinicalCUI;
function Demo() {
  const [open, setOpen] = React.useState(true);
  const [log, setLog] = React.useState('');
  return h('div', { style: { maxWidth: 390, display: 'flex', flexDirection: 'column', gap: 12 } },
    h(UndoToast, { open, position: 'inline', duration: 30000, message: 'Recorded paracetamol 1 g given at 13:05', onUndo: () => { setOpen(false); setLog('Undone'); }, onTimeout: () => { setOpen(false); setLog('Final'); } }),
    h(UndoToast, { open: true, position: 'inline', paused: true, dismissible: true, duration: 10000, message: 'Recorded obs set: EWS 3', onUndo: () => undefined, onTimeout: () => undefined }),
    log ? h('p', { style: { margin: 0 } }, log) : null,
    h(TouchButton, { size: 48, onClick: () => { setOpen(true); setLog(''); } }, 'Record again')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
