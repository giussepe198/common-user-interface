<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NhiInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">NhiInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">NHI input (NZ): legacy and new formats, test-range warning, dormant NHI lookup · Guidelines: <code>src/patient/NhiInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { NhiInput } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 32, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    h(NhiInput, { defaultValue: 'zbn77vl', flagTestNumbers: false }),
    h(NhiInput, { id: 'preview-nhi-test', defaultValue: 'ZAC5361', hint: '' }),
    h(NhiInput, { id: 'preview-nhi-io', defaultValue: 'ZAI5361', hint: '' }),
    h(NhiInput, { id: 'preview-nhi-bad', defaultValue: 'ZBN77VM', hint: '' }),
    h(NhiInput, { label: 'NHI number (with lookup)', defaultValue: 'ZAC5361', flagTestNumbers: false, lookupNhi: (n) => (n === 'ZAC5361' ? { status: 'dormant', liveNhi: 'ZBN77VL' } : { status: 'live' }) })
  )
);
setTimeout(() => {
  ['preview-nhi-test', 'preview-nhi-io', 'preview-nhi-bad'].forEach((id) => { const el = document.getElementById(id); if (el) { el.focus(); el.blur(); } });
}, 30);
</script>

</div>
</body>
</html>
