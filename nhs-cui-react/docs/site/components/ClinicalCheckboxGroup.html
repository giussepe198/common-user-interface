<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinicalCheckboxGroup · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">ClinicalCheckboxGroup</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Check boxes: independent, labelled, no mixed state · Guidelines: <code>src/noting/ClinicalCheckboxGroup/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalCheckboxGroup } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 48, flexWrap: 'wrap' } },
    h(ClinicalCheckboxGroup, { legend: 'Associated symptoms', prompt: 'Tick all that apply', defaultValue: ['breathless', 'cough'], options: [
      { value: 'breathless', label: 'Breathlessness' },
      { value: 'cough', label: 'Cough' },
      { value: 'chest-pain', label: 'Chest pain', reveals: true, prompt: 'Opens chest pain details' },
      { value: 'palpitations', label: 'Palpitations' },
    ] }),
    h(ClinicalCheckboxGroup, { legend: 'Information given to patient', required: true, missed: true, options: [
      { value: 'leaflet', label: 'Written leaflet' },
      { value: 'verbal', label: 'Verbal explanation' },
      { value: 'carer', label: 'Carer informed' },
    ] })
  )
);
</script>

</div>
</body>
</html>
