<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaveTracker · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">LeaveTracker</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Leave tracker: absent and overdue first, filters with counts, escalation in words · Guidelines: <code>src/mental-health/LeaveTracker/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { LeaveTracker, ClinicalLocaleProvider } = window.ClinicalCUI;
const now = '2026-10-28T03:00:00Z';
const p = function (f, g, m) { return { familyName: f, givenName: g, dateOfBirth: '1988-04-20', mrn: m }; };
const episodes = [
  { id: '1', person: p('Smith', 'Alex', '009981'), sex: 'Male', bed: 'Bed 2', status: 'absent', absentSince: '2026-10-28T00:30:00Z', leaveType: 'Ground leave' },
  { id: '2', person: p('Nguyen', 'Thi Lan', '004512'), sex: 'Female', bed: 'Bed 4', status: 'on-leave', leaveType: 'Day leave', startAt: '2026-10-27T23:00:00Z', expectedReturnAt: '2026-10-28T02:30:00Z', authorisedBy: 'Dr A Okafor' },
  { id: '3', person: p('Brown', 'Sam', '001234'), bed: 'Bed 7', status: 'on-leave', leaveType: 'Escorted leave', startAt: '2026-10-28T01:00:00Z', expectedReturnAt: '2026-10-28T03:30:00Z', dueState: 'due-back' },
  { id: '4', person: p('Walker', 'Jo', '007700'), sex: 'Non-binary', bed: 'Bed 9', status: 'authorised', leaveType: 'Overnight leave', startAt: '2026-10-28T06:00:00Z', expectedReturnAt: '2026-10-29T06:00:00Z' },
  { id: '5', person: p('Taylor', 'Kim', '002468'), bed: 'Bed 11', status: 'returned', leaveType: 'Day leave', returnedAt: '2026-10-28T01:40:00Z' }
];
const noop = function () {};
ReactDOM.createRoot(document.getElementById('root')).render(
  h(ClinicalLocaleProvider, { region: 'AU' },
    h('div', { style: { padding: 16, background: 'var(--surface)' } },
      h(LeaveTracker, { episodes: episodes, now: now, context: 'Ward 3', timeZone: 'Australia/Melbourne', onRecordReturn: noop, onRecordAbsent: noop, onExtend: noop, onStart: noop, absentAction: 'Notify police and the nominated support person (example host words).' })
    )
  )
);
</script>

</div>
</body>
</html>
