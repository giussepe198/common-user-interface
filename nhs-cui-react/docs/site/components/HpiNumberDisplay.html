<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HpiNumberDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">HpiNumberDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Provider identifiers: AU HPI-I and HPI-O, NZ HPI formats · Guidelines: <code>src/patient/HpiNumberDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { HpiNumberDisplay } = window.ClinicalCUI;
const caption = (t) => h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)', marginTop: 8 } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 6, padding: 12, background: 'var(--surface)' } },
    caption('AU (prefix and Luhn check)'),
    h(HpiNumberDisplay, { region: 'AU', value: '8003611234567893' }),
    h(HpiNumberDisplay, { region: 'AU', value: '8003621234567892' }),
    h(HpiNumberDisplay, { region: 'AU', type: 'hpi-i', value: '8003611234567894' }),
    caption('NZ (format only)'),
    h(HpiNumberDisplay, { region: 'NZ', value: '99ZZZZ' }),
    h(HpiNumberDisplay, { region: 'NZ', value: 'GZZ999-C' }),
    h(HpiNumberDisplay, { region: 'NZ', value: 'FZZ999-C' })
  )
);
</script>

</div>
</body>
</html>
