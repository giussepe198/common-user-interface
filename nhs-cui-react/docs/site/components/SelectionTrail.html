<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SelectionTrail · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Medications</p>
<h1 style="margin:0 0 4px;font-size:20px">SelectionTrail</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Selection trail: each selection in its own control, any one reopens the lists · Guidelines: <code>src/medications/SelectionTrail/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SelectionTrail, MedicationLine, ClinicalLocaleProvider } = window.ClinicalCUI;
const block = (title, el) => h('div', { style: { marginBottom: 20 } }, h('div', { className: 'cui-label', style: { marginBottom: 6 } }, title), el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    block('GB: drug, route and form chosen', h(SelectionTrail, { onReopen: () => {}, items: [
      { id: 'drug', kind: 'Drug', label: h(MedicationLine, { genericName: 'diltiazem', brandName: 'Dilzem SR' }), text: 'diltiazem, DILZEM SR' },
      { id: 'route', kind: 'Route', label: 'oral – modified-release' },
      { id: 'form', kind: 'Form', label: 'modified-release capsule' }] })),
    block('AU: drug name follows the regional rules', h(ClinicalLocaleProvider, { region: 'AU' }, h(SelectionTrail, { onReopen: () => {}, items: [
      { id: 'drug', kind: 'Drug', label: h(MedicationLine, { genericName: 'clarithromycin' }), text: 'clarithromycin' },
      { id: 'route', kind: 'Route', label: 'oral' }] }))),
    block('NZ', h(ClinicalLocaleProvider, { region: 'NZ' }, h(SelectionTrail, { onReopen: () => {}, items: [
      { id: 'drug', kind: 'Drug', label: h(MedicationLine, { genericName: 'carbamazepine' }), text: 'carbamazepine' },
      { id: 'route', kind: 'Route', label: 'oral' }] })))
  )
);
</script>

</div>
</body>
</html>
