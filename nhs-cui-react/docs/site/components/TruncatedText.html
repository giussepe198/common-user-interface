<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruncatedText · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Display standards</p>
<h1 style="margin:0 0 4px;font-size:20px">TruncatedText</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Clinical term truncation between whole words, with access to full text · Guidelines: <code>src/datetime/TruncatedText/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TruncatedText } = window.ClinicalCUI;
const term = 'Emergency replacement of aneurysmal segment of aorta by anastomosis of aorta to superficial femoral artery';
const box = (label, node, w) => h('div', { style: { marginBottom: 12 } },
  h('div', { className: 'cui-label', style: { marginBottom: 2 } }, label),
  h('div', { style: { width: w || 320, padding: '4px 8px', border: '1px solid var(--border)', background: 'var(--surface)' } }, node));
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    box('End truncation, inline reveal button', h(TruncatedText, { text: term })),
    box('Never splits a number from its unit', h(TruncatedText, { text: 'Chest pain with 1-24 hours of onset and radiation to left arm' }), 250),
    box('Middle truncation (single line), flyout on hover or focus', h(TruncatedText, { text: term, mode: 'middle', reveal: 'flyout' }), 420),
    box('Wrap (preferred: no truncation)', h(TruncatedText, { text: term, mode: 'wrap' }))
  )
);
</script>

</div>
</body>
</html>
