<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreferenceIcon · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:848px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Decision support</p>
<h1 style="margin:0 0 4px;font-size:20px">PreferenceIcon</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Preference icon: five levels, tooltip of reasons, clickable variant · Guidelines: <code>src/administration/PreferenceIcon/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PreferenceIcon } = window.ClinicalCUI;
const item = function (level, text) {
  return h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, padding: 6, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 2 } },
    h(PreferenceIcon, { level: level, reasons: [text] }), h('span', null, text));
};
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 70 } },
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 140px), 1fr))', gap: 6 } },
      item(1, 'Lowest'), item(2, 'Low'), item(3, 'Medium'), item(4, 'High'), item(5, 'Highest')),
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
      h(PreferenceIcon, { level: 2, reasons: ['Potential drug-drug interaction with Furosemide', 'Asthma recorded'], onClick: function () {}, optionLabel: 'Atenolol', expanded: false }),
      h('span', null, 'Clickable: opens the explanation (tooltip shown on hover or focus, with several reasons as a bulleted list)'))
  )
);
setTimeout(function () { const b = document.querySelector('.cui-ds-pref--button'); if (b) b.focus(); }, 30);
</script>

</div>
</body>
</html>
