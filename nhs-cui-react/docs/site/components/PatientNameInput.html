<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatientNameInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">PatientNameInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Patient name input, InForm and InLine layouts · Guidelines: <code>src/patient/PatientNameInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalLocaleProvider } = window.ClinicalCUI;
const regionCaption = (t) => h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)', margin: '12px 0 4px' } }, t);
const inRegion = (region, child, extra) => h(ClinicalLocaleProvider, Object.assign({ region }, extra || {}), child);
const { PatientNameInput } = window.ClinicalCUI;
const panel = (t, child) => h('div', { style: { padding: 16, background: 'var(--surface)', border: '1px solid var(--border)' } },
  h('div', { style: { font: '600 15px/20px var(--font-sans)', marginBottom: 12 } }, t), child);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    regionCaption('GB (NHS CUI)'),
  h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'flex-start' } },
    panel('InForm (default)', h(PatientNameInput, {
      defaultValue: { title: 'Mr', familyName: 'SMITH', givenName: 'John', middleNames: '', suffix: '', preferredName: '' },
    })),
    panel('InLine, with an error', h(PatientNameInput, {
      layout: 'inline', fields: ['title', 'familyName', 'givenName', 'preferredName'],
      defaultValue: { title: 'Professor', familyName: '', givenName: 'Catherine' },
      errors: { familyName: 'Enter the family name' },
    }))
  ),
    regionCaption('AU and NZ: regional labels and lengths, single-name option, case kept as given'),
    h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'flex-start' } },
      inRegion('AU', panel('AU', h(PatientNameInput, {
        defaultValue: { title: '', familyName: "O'Brien", givenName: 'Mia', middleNames: 'Rose', suffix: '', preferredName: 'Mimi' },
      }))),
      inRegion('NZ', panel('NZ, single name', h(PatientNameInput, {
        fields: ['title', 'familyName', 'givenName', 'middleNames', 'preferredName'],
        defaultValue: { familyName: 'Ngāwai', givenName: '', singleName: true },
      }))))
  )
);
</script>

</div>
</body>
</html>
