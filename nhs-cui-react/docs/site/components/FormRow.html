<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormRow · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Forms</p>
<h1 style="margin:0 0 4px;font-size:20px">FormRow</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Fields side by side: wrapping labels and errors never move a control · Guidelines: <code>src/forms/FormRow/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FormRow, FormField, TextInput, Select, DateInput, RadioGroup, RequiredKey } = window.ClinicalCUI;
function Demo() {
  return h('div', { style: { maxWidth: 960 } },
    h(FormRow, null,
      h(FormField, { label: 'Family name (as recorded on the identity document)', required: true }, h(TextInput, { defaultValue: 'CITIZEN' })),
      h(FormField, { label: 'Given name', error: 'Enter a given name' }, h(TextInput)),
      h(FormField, { label: 'Date of birth', prompt: 'Day first' }, h(DateInput, { label: 'Date of birth', bare: true, hideInstructions: true })),
      h(FormField, { label: 'Pronouns' }, h(Select, { options: [{ value: 'she', label: 'She/her' }, { value: 'he', label: 'He/him' }, { value: 'they', label: 'They/them' }] }))
    ),
    h(FormRow, { template: '2fr 1fr' },
      h(FormField, { label: 'Address line' }, h(TextInput)),
      h(RadioGroup, { label: 'Interpreter needed', orientation: 'horizontal', options: [{ value: 'y', label: 'Yes' }, { value: 'n', label: 'No' }] })
    ),
    h(RequiredKey)
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
