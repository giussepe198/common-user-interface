<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Display standards</p>
<h1 style="margin:0 0 4px;font-size:20px">IconButton</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Icon commands and status icons with function labels · Guidelines: <code>src/datetime/IconButton/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { IconButton } = window.ClinicalCUI;
const row = (label, ...nodes) => h('div', { style: { display: 'flex', gap: 12, alignItems: 'center', padding: '4px 0', flexWrap: 'wrap' } }, h('span', { className: 'cui-label', style: { width: 170, flex: 'none' } }, label), ...nodes);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { background: 'var(--surface)', padding: 12, borderRadius: 4 } },
    row('Labelled (default)', h(IconButton, { icon: 'search', label: 'Search', shortcut: 'Ctrl+F' }), h(IconButton, { icon: 'plus', label: 'Add patient' }), h(IconButton, { icon: 'pencil', label: 'Edit patient', disabled: true })),
    row('Icon only, sizes', h(IconButton, { icon: 'refresh', label: 'Refresh', showLabel: false, shortcut: 'F5' }), h(IconButton, { icon: 'refresh', label: 'Refresh', showLabel: false, size: 24 }), h(IconButton, { icon: 'filter', label: 'Filter', pressed: true, size: 24, labelPosition: 'below' })),
    row('Meaning and importance', h(IconButton, { icon: 'error', label: 'Stop infusion', meaning: 'error', importance: 'high' }), h(IconButton, { icon: 'warning', label: 'Check dose', meaning: 'caution' }), h(IconButton, { icon: 'check', label: 'Checked', meaning: 'ok' })),
    row('Status (not clickable)', h(IconButton, { icon: 'lock', label: 'Sealed record', variant: 'inline-status' }), h(IconButton, { icon: 'history', label: 'Repeat medication', variant: 'information', showLabel: false }))
  )
);
</script>

</div>
</body>
</html>
