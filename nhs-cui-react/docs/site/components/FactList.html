<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FactList · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Data display</p>
<h1 style="margin:0 0 4px;font-size:20px">FactList</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Fact list: label and value pairs in a grid and in rows · Guidelines: <code>src/data/FactList/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FactList } = window.ClinicalCUI;
const items = [
  { label: 'Source', value: 'GP' }, { label: 'Received', value: '20-Oct-2026' },
  { label: 'Priority', value: 'Routine' }, { label: 'Keyworker', value: null, unknownText: 'Not allocated' },
  { label: 'Episode', value: 'Community', onOpenRecord: () => {}, definition: 'The episode of care this referral opened' },
  { label: 'Reason for referral', value: 'Low mood and poor sleep for three months, worse since a change of job; asks for a review of medication.', wide: true },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gap: 24 } },
    h(FactList, { 'aria-label': 'Referral details', items }),
    h('div', { style: { maxWidth: 520 } }, h(FactList, { layout: 'rows', 'aria-label': 'Referral details in rows', items })))
);
</script>

</div>
</body>
</html>
