<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ObservationLevel · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">ObservationLevel</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Observation level: constant, close, intermittent with interval, general; words from props · Guidelines: <code>src/mental-health/ObservationLevel/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ObservationLevel } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8, padding: 16, background: 'var(--surface)', alignItems: 'flex-start' } },
    h(ObservationLevel, { level: 'constant', detail: 'Within arm’s length' }),
    h(ObservationLevel, { level: 'close' }),
    h(ObservationLevel, { level: 'intermittent', intervalMinutes: 15 }),
    h(ObservationLevel, { level: 'general' }),
    h(ObservationLevel, { level: 'intermittent', intervalMinutes: 30, size: 'compact', labels: { intermittent: 'Level 3 (example host words)' } })
  )
);
</script>

</div>
</body>
</html>
