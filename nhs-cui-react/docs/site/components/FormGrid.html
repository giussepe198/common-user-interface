<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormGrid · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Forms</p>
<h1 style="margin:0 0 4px;font-size:20px">FormGrid</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Columns that collapse with the grid width; a full-width text area · Guidelines: <code>src/forms/FormGrid/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FormGrid, FormGridSpan, FormField, TextInput, TextArea, Combobox, TimeInput } = window.ClinicalCUI;
const teams = [{ value: 'a', label: 'Community team North' }, { value: 'b', label: 'Acute care team' }];
function Demo() {
  return h('div', null,
    h(FormGrid, { columns: 3 },
      h(FormField, { label: 'Preferred name' }, h(TextInput, { defaultValue: 'Sam' })),
      h(FormField, { label: 'Team responsible for the current episode of care' }, h(Combobox, { options: teams })),
      h(FormField, { label: 'Time seen' }, h(TimeInput, { label: 'Time seen', bare: true, showClockIndicator: false, hideInstructions: true })),
      h(FormField, { label: 'Phone' , prompt: 'Use TelephoneNumberInput for validated numbers' }, h(TextInput, { type: 'text' })),
      h(FormField, { label: 'Email', error: 'Enter an email address like name@example.org' }, h(TextInput, { type: 'email' })),
      h(FormField, { label: 'Case number' }, h(TextInput, { widthChars: 10 })),
      h(FormGridSpan, { span: 'full' }, h(FormField, { label: 'Reason for referral' }, h(TextArea, { maxLength: 500 })))
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
