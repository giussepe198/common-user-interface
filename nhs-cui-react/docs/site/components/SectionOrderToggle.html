<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SectionOrderToggle · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">SectionOrderToggle</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Section order (experimental): order added or standard order; items inside sections unchanged · Guidelines: <code>src/noting/SectionOrderToggle/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SectionOrderToggle, orderTemplateSections } = window.ClinicalCUI;
const added = [{ title: 'Plan' }, { title: 'Presenting complaint' }, { title: 'Past medical history' }, { title: 'Observations and findings' }];
function Demo() {
  const [mode, setMode] = React.useState('standard');
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
    h(SectionOrderToggle, { value: mode, onChange: setMode, standardLabel: 'Standard order (admission headings)' }),
    h('ol', { style: { margin: 0, paddingLeft: 20 } }, orderTemplateSections(added, mode).map((s) => h('li', { key: s.title }, s.title))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
