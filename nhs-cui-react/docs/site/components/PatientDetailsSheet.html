<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatientDetailsSheet · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile screens</p>
<h1 style="margin:0 0 4px;font-size:20px">PatientDetailsSheet</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Patient details sheet (A2): identity, protected address with reveal-with-reason, ethnicity, allergies · Guidelines: <code>src/mobile/PatientDetailsSheet/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PatientDetailsSheet, ClinicalLocaleProvider } = window.ClinicalCUI;
const now = new Date(2026, 9, 27, 14, 6);
const patient = {
  name: { familyName: 'Ngata', givenName: 'Mereana', title: 'Ms' }, preferredName: 'Mere', dateOfBirth: '1958-03-14', gender: 'F',
  identifiers: [{ type: 'nhi', value: 'ZZZ0016', nhiStatus: 'live' }],
  ethnicity: { entries: [{ code: '21111', label: 'Māori' }, { code: '31111', label: 'Samoan' }] },
  protection: { address: true },
  address: { lines: ['12 Kowhai Street'], suburb: 'Southbrook', town: 'Rangiora', postcode: '7400' },
  phones: { mobile: '0270001234' },
  allergies: { status: 'known', items: [
    { name: 'penicillin', reaction: 'Anaphylaxis, 2019', lastUpdated: '2024-02-02', recordedBy: 'Dr A Moana' },
    { name: 'latex', reaction: 'Contact dermatitis', lastUpdated: '2024-02-02', recordedBy: 'Dr A Moana', newThisAdmission: true },
  ] },
};
function Demo() {
  const [open, setOpen] = React.useState(true);
  return h('div', { style: { position: 'relative', height: 820, maxWidth: 390, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface-sunken)' } },
    h('div', { style: { padding: 16 } }, h('button', { type: 'button', className: 'cui-touch-button cui-touch-button--secondary cui-touch-button--h48', onClick: () => setOpen(true) }, 'Open patient details')),
    h(ClinicalLocaleProvider, { region: 'NZ' },
      h(PatientDetailsSheet, { open, onClose: () => setOpen(false), patient, now, portal: false, autoFocus: false, closeOnBrowserBack: false, onRevealProtected: () => true }))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
