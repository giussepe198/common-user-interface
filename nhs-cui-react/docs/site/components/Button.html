<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Foundations</p>
<h1 style="margin:0 0 4px;font-size:20px">Button</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Command buttons · Guidelines: <code>src/core/Button/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { Button } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
    h(Button, { variant: 'primary' }, 'Authorise'),
    h(Button, { icon: 'plus' }, 'Add medication'),
    h(Button, { variant: 'quiet', icon: 'filter' }, 'Filter'),
    h(Button, { variant: 'danger', icon: 'trash' }, 'Remove'),
    h(Button, { disabled: true }, 'Disabled'),
    h(Button, { iconOnly: true, icon: 'search' }, 'Search')
  )
);
</script>

</div>
</body>
</html>
