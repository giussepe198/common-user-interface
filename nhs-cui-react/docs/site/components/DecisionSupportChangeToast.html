<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DecisionSupportChangeToast · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Decision support</p>
<h1 style="margin:0 0 4px;font-size:20px">DecisionSupportChangeToast</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Pop-ups for a service change and for a new alert; fade out after 5 to 10 seconds · Guidelines: <code>src/administration/DecisionSupportChangeToast/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DecisionSupportChangeToast } = window.ClinicalCUI;
const at = function (hh, mm) { return new Date(2026, 4, 27, hh, mm); };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(DecisionSupportChangeToast, { dateTime: at(10, 42), message: 'Dose Calculations and Formulary Management are not running', durationMs: 10000 }),
    h(DecisionSupportChangeToast, { dateTime: at(10, 47), status: 'High Priority', message: 'The potassium level is 7.7 mmol/L', durationMs: 10000, onClick: function () {} }),
    h(DecisionSupportChangeToast, { dateTime: at(10, 49), status: 'Priority', message: 'Creatinine has risen since the last result', durationMs: 10000, onClick: function () {} })
  )
);
</script>

</div>
</body>
</html>
