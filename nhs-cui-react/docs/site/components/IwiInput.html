<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IwiInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">IwiInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Iwi affiliation (NZ, HISO 10094): macron-insensitive look-up, many iwi · Guidelines: <code>src/patient/IwiInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { IwiInput } = window.ClinicalCUI;
// Consumer-supplied reference list (two entries from the HISO 10094 examples; a real system supplies the full classification).
const iwiList = [{ code: '0101', name: 'Te Aupōuri' }, { code: '0104', name: 'Ngāpuhi' }];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 48, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    h(IwiInput, { iwiList, defaultValue: { knows: 'yes', iwi: [{ code: '0104', name: 'Ngāpuhi', rohe: 'Te Tai Tokerau' }, { name: 'Te Rarawa' }] } }),
    h(IwiInput, { iwiList })
  )
);
</script>

</div>
</body>
</html>
