<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UpdateMarker · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">UpdateMarker</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Update marker: corner triangle with highlight, wrapped content, symbol in a cell, removed content · Guidelines: <code>src/lists/UpdateMarker/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { UpdateMarker } = window.ClinicalCUI;
const box = { border: '1px solid var(--border-strong)', background: 'var(--surface)', width: 260 };
const head = text => h('div', { style: { fontSize: 12, color: 'var(--ink-muted)', margin: '0 0 4px' } }, text);
function Demo() {
  const [marked, setMarked] = React.useState(true);
  return h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h('div', null, head('Updated content (select the triangle to unmark)'),
      h('div', { style: box }, marked
        ? h(UpdateMarker, { label: 'Working diagnosis', onUnmark: () => setMarked(false) }, 'Community-acquired pneumonia')
        : h('div', { style: { padding: '8px 12px' } }, 'Community-acquired pneumonia'))),
    h('div', null, head('Symbol only, inside a styled cell'),
      h('div', { style: Object.assign({}, box, { position: 'relative', padding: '8px 20px 8px 12px', background: 'var(--info-surface)' }) }, 'NEWS2 score 5', h(UpdateMarker, { label: 'NEWS2 score' }))),
    h('div', null, head('Content removed'),
      h('div', { style: box }, h(UpdateMarker, { label: 'Consultant', removed: true })))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
