<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiskFormulation · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">RiskFormulation</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Risk formulation: factors, summary and plan in words, read and edit modes · Guidelines: <code>src/mental-health/RiskFormulation/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { RiskFormulation } = window.ClinicalCUI;
const value = {
  staticFactors: ['Previous admission in 2024'],
  dynamicFactors: ['Recent loss of housing', 'Not sleeping'],
  protectiveFactors: ['Close to sister', 'Engaged with the team'],
  summary: 'Risk to self is raised while housing is uncertain and sleep is poor.',
  plan: 'Daily phone contact this week; housing referral; review on Friday.'
};
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 24, padding: 16, background: 'var(--surface)' } },
    h(RiskFormulation, { defaultValue: value, recordedBy: 'J Clinician', recordedAt: '2026-10-20T00:00:00Z', reviewDue: '2027-01-19', onEdit: function () {}, now: '2026-10-28T03:00:00Z', timeZone: 'Australia/Melbourne' }),
    h(RiskFormulation, { mode: 'edit', defaultValue: value, onSave: function () {}, onCancel: function () {}, labels: { heading: 'Edit risk formulation' } })
  )
);
</script>

</div>
</body>
</html>
