<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LegalOrderCard · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">LegalOrderCard</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Legal order card: dates in the jurisdiction zone, conditions, clinician, actions (Victorian and NZ wording) · Guidelines: <code>src/mental-health/LegalOrderCard/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { LegalOrderCard, Button } = window.ClinicalCUI;
const now = '2026-10-28T03:00:00Z';
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, padding: 16, background: 'var(--surface-sunken)' } },
    h(LegalOrderCard, {
      orderType: 'Community treatment order (example, VIC)',
      startedAt: '2026-08-14T00:00:00Z', expiresAt: '2026-10-30T06:00:00Z', reviewAt: '2026-10-29T00:00:00Z', hearingAt: '2026-11-05T23:30:00Z',
      conditions: ['Attend appointments with the treating team', 'Accept treatment as prescribed'],
      responsibleClinician: { name: 'Dr A Example', role: 'Authorised psychiatrist' },
      labels: { hearing: 'Tribunal hearing' },
      countdown: { soonWithinMinutes: 4320, urgentWithinMinutes: 1440 },
      timeZone: 'Australia/Melbourne', now: now,
      actions: [h(Button, { key: 'a', size: 'sm', variant: 'primary' }, 'Record outcome'), h(Button, { key: 'b', size: 'sm' }, 'Vary order')]
    }),
    h(LegalOrderCard, {
      orderType: 'Compulsory treatment order (example, NZ)', state: 'unconfirmed', unconfirmedWarning: 'Order may have expired, status not confirmed',
      source: 'Information received from Eastgate Health on 02-Jun-2026 11:30 NZST',
      startedAt: '2026-04-01T00:00:00Z', expiresAt: '2026-10-01T00:00:00Z', timeZone: 'Pacific/Auckland', now: now
    })
  )
);
</script>

</div>
</body>
</html>
