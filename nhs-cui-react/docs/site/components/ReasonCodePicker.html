<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReasonCodePicker · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">ReasonCodePicker</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Reason codes (B3): AU NIMC W with required reason, NZ NMC R with prescriber prompt, GB without code letters · Guidelines: <code>src/touch/ReasonCodePicker/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ReasonCodePicker } = window.ClinicalCUI;
const cap = t => h('p', { className: 'cui-label', style: { margin: '16px 0 4px' } }, t);
const frame = c => h('div', { style: { maxWidth: 390, border: '1px solid var(--border)', paddingTop: 12, background: 'var(--surface)' } }, c);
// Fictional copies of the administration area's adminReasonCodes(region) lists, for the preview only.
const AU = [
  { code: 'A', label: 'Absent' }, { code: 'F', label: 'Fasting' },
  { code: 'R', label: 'Refused', legend: 'Refused – notify prescriber', notifyPrescriber: true },
  { code: 'V', label: 'Vomiting' }, { code: 'L', label: 'On leave' },
  { code: 'N', label: 'Not available', legend: 'Not available – obtain supply or contact prescriber', notifyPrescriber: true },
  { code: 'W', label: 'Withheld', legend: 'Withheld – enter reason in clinical record', requiresReason: true },
  { code: 'S', label: 'Self administered' }
];
const NZ = [
  { code: 'CP', label: 'Carer or parent administered' }, { code: 'D', label: 'Dose withheld', requiresReason: true },
  { code: 'N', label: 'Nil by mouth' }, { code: 'R', label: 'Patient refused', notifyPrescriber: true, hint: 'Offer again within one hour.' },
  { code: 'RV', label: 'Patient vomited' }
];
const GB = [
  { code: 'R', label: 'Patient refused', showCode: false }, { code: 'A', label: 'Patient absent', showCode: false },
  { code: 'C', label: 'Other clinical reason', showCode: false, requiresReason: true }, { code: 'U', label: 'Drug unavailable', showCode: false }
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    cap('AU NIMC: W chosen, reason required'),
    frame(h(ReasonCodePicker, { options: AU, legend: 'NIMC code', defaultValue: { code: 'W', reason: 'Temperature 36.9, patient comfortable. Will review at 16:00.', prompts: {} }, reasonHint: 'Tap the field and speak, or type' })),
    cap('NZ NMC: R chosen, prescriber prompt; validation shown'),
    frame(h(ReasonCodePicker, { options: NZ, legend: 'NMC code', defaultValue: { code: 'R', reason: '', prompts: {} }, requirePrescriberPrompt: true, showValidation: true })),
    cap('GB: no code letters, nothing chosen yet, validation shown'),
    frame(h(ReasonCodePicker, { options: GB, legend: 'Reason', showValidation: true }))
  )
);
</script>

</div>
</body>
</html>
