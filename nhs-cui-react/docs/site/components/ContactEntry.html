<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContactEntry · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">ContactEntry</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Contact entry: view line with note, entered in error, edit with CUI date, time and duration inputs · Guidelines: <code>src/mental-health/ContactEntry/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ContactEntry, ClinicalLocaleProvider } = window.ClinicalCUI;
const contact = { startAt: '2026-10-28T03:00:00Z', durationMinutes: 50, contactType: 'Face to face', setting: 'Home visit', participants: ['The person', 'Carer'], author: 'J Lee, case manager', note: 'Lan said the week had been "a bit better than last". Talked about sleep and the plan for Friday.' };
ReactDOM.createRoot(document.getElementById('root')).render(
  h(ClinicalLocaleProvider, { region: 'AU' },
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20, padding: 16, background: 'var(--surface)' } },
      h(ContactEntry, { contact: contact, timeZone: 'Australia/Melbourne', onEdit: function () {} }),
      h(ContactEntry, { headingLevel: 3, contact: Object.assign({}, contact, { enteredInError: { reason: 'Recorded against the wrong person' } }), timeZone: 'Australia/Melbourne' }),
      h('div', { style: { maxWidth: 520 } },
        h(ContactEntry, { mode: 'edit', headingLevel: 3, title: 'New contact', notePrompt: 'Include the person’s own words where you can',
          contactTypes: [{ value: 'f2f', label: 'Face to face' }, { value: 'phone', label: 'Phone' }, { value: 'video', label: 'Video' }],
          settings: [{ value: 'home', label: 'Home visit' }, { value: 'clinic', label: 'Clinic' }],
          participantOptions: [{ value: 'person', label: 'The person' }, { value: 'carer', label: 'Carer' }, { value: 'gp', label: 'GP' }],
          defaultValue: { date: { kind: 'full', year: 2026, month: 10, day: 28 }, time: { hours: 14, minutes: 0 }, participants: ['person'] }, onSave: function () {}, onCancel: function () {} }))
    )
  )
);
</script>

</div>
</body>
</html>
