<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Forms</p>
<h1 style="margin:0 0 4px;font-size:20px">FileInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Choose or drop files; turned-down files say why · Guidelines: <code>src/forms/FileInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FormField, FileInput } = window.ClinicalCUI;
const letter = new File(['x'.repeat(48000)], 'referral-letter-example.pdf', { type: 'application/pdf' });
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 480 } },
    h(FormField, { label: 'Referral letter' }, h(FileInput, { accept: '.pdf', acceptText: 'PDF', maxSizeBytes: 20 * 1024 * 1024, defaultValue: [letter] })),
    h(FormField, { label: 'Photos', prompt: 'Up to 5 images' }, h(FileInput, { accept: 'image/*', acceptText: 'Images', multiple: true, maxFiles: 5 }))
  )
);
</script>

</div>
</body>
</html>
