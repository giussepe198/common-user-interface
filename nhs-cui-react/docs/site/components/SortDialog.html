<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortDialog · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">SortDialog</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Progressive sort dialog with plain-language order words · Guidelines: <code>src/lists/SortDialog/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SortDialog } = window.ClinicalCUI;
const attributes = [
  { id: 'bed', label: 'Location', dataType: 'string' },
  { id: 'consultant', label: 'Consultant', dataType: 'unorderedSymbol' },
  { id: 'age', label: 'Age', dataType: 'integer' },
  { id: 'admitted', label: 'Admitted', dataType: 'date' },
];
const hidden = [{ id: 'avpu', label: 'AVPU', dataType: 'ordinal', options: ['Alert', 'Responds to voice', 'Responds to pain', 'Unresponsive'] }];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(SortDialog, { modal: false, tableName: 'ward patient list', rowNoun: 'patients', attributes, hiddenAttributes: hidden, onOk: () => {}, onCancel: () => {}, onPreview: () => {},
      initial: [{ attributeId: 'consultant', direction: 'asc' }, { attributeId: 'age', direction: 'asc' }, { attributeId: 'admitted', direction: 'desc' }] }),
    h(SortDialog, { modal: false, tableName: 'medications', rowNoun: 'medications', attributes, onOk: () => {}, onCancel: () => {} })
  )
);
</script>

</div>
</body>
</html>
