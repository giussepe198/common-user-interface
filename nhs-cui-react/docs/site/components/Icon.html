<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Foundations</p>
<h1 style="margin:0 0 4px;font-size:20px">Icon</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Line icons, 16 and 24px · Guidelines: <code>src/core/Icon/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { Icon, ICON_PATHS } = window.ClinicalCUI;
const names = Object.keys(ICON_PATHS);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(124px, 1fr))', gap: 8 } },
    names.map(n => h('div', { key: n, style: { display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: 'var(--ink-muted)' } },
      h('span', { style: { color: 'var(--ink)' } }, h(Icon, { name: n, size: 24, label: n })), n)))
);
</script>

</div>
</body>
</html>
