<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RadioGroup · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Forms</p>
<h1 style="margin:0 0 4px;font-size:20px">RadioGroup</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">One choice, nothing chosen by default · Guidelines: <code>src/forms/RadioGroup/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { RadioGroup } = window.ClinicalCUI;
const opts = [{ value: 'y', label: 'Yes' }, { value: 'n', label: 'No' }, { value: 'u', label: 'Not known' }];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 460 } },
    h(RadioGroup, { label: 'Interpreter needed', options: opts, defaultValue: 'n' }),
    h(RadioGroup, { label: 'Interpreter needed', options: opts, orientation: 'horizontal', required: true, error: 'Choose an answer' })
  )
);
</script>

</div>
</body>
</html>
