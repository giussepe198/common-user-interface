<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypedReadBackConfirm · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">TypedReadBackConfirm</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Typed read-back (P4): match, mismatch, unsafe trailing zero · Guidelines: <code>src/touch/TypedReadBackConfirm/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TypedReadBackConfirm } = window.ClinicalCUI;
const card = c => h('section', { style: { maxWidth: 390, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4, padding: '12px 14px', marginBottom: 12 } }, c);
const expected = { value: 6, unit: 'units', unitAliases: ['unit'] };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    card(h(TypedReadBackConfirm, { label: 'Type the dose you are giving', expected, defaultValue: '6' })),
    card(h(TypedReadBackConfirm, { label: 'Type the dose you are giving', expected, defaultValue: '60' })),
    card(h(TypedReadBackConfirm, { label: 'Type the dose you are giving', expected, defaultValue: '6.0' }))
  )
);
</script>

</div>
</body>
</html>
