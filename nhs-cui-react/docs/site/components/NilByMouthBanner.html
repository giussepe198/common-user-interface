<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NilByMouthBanner · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Drug administration</p>
<h1 style="margin:0 0 4px;font-size:20px">NilByMouthBanner</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Nil by Mouth notification; takes no space when not active · Guidelines: <code>src/administration/NilByMouthBanner/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { NilByMouthBanner, Button } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
    h(NilByMouthBanner, { since: new Date(2026, 4, 27, 6, 0), until: new Date(2026, 4, 27, 18, 0), reason: 'For theatre this afternoon' }),
    h(NilByMouthBanner, { since: new Date(2026, 4, 27, 6, 0), actions: h(Button, { size: 'sm' }, 'View instruction') }),
    h('div', { className: 'cui-label' }, 'When active is false the banner renders nothing:'),
    h(NilByMouthBanner, { active: false }),
    h('div', { style: { padding: 8, border: '1px dashed var(--border-strong)', color: 'var(--ink-muted)' } }, 'Medication lines start here')
  )
);
</script>

</div>
</body>
</html>
