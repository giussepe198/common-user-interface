<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TelephoneNumberDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">TelephoneNumberDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Telephone number display · Guidelines: <code>src/patient/TelephoneNumberDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalLocaleProvider } = window.ClinicalCUI;
const regionCaption = (t) => h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)', margin: '12px 0 4px' } }, t);
const inRegion = (region, child, extra) => h(ClinicalLocaleProvider, Object.assign({ region }, extra || {}), child);
const { TelephoneNumberDisplay } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    regionCaption('GB (NHS CUI)'),
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, padding: 12, background: 'var(--surface)' } },
    h(TelephoneNumberDisplay, { label: 'Home', value: '+44 118 496 0123' }),
    h(TelephoneNumberDisplay, { label: 'Work', value: '02079460472', extension: '1234' }),
    h(TelephoneNumberDisplay, { label: 'Mobile', value: '07700900555', asLink: true }),
    h(TelephoneNumberDisplay, { label: 'Next of Kin', value: '0012125552368' }),
    h(TelephoneNumberDisplay, { label: 'Other', value: '+888 12.34.56.78' }),
    h(TelephoneNumberDisplay, { label: 'Fax', value: null })
  ),
    regionCaption('AU: Style Manual groupings; foreign numbers keep +CC'),
    inRegion('AU', h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, padding: 12, background: 'var(--surface)' } },
      h(TelephoneNumberDisplay, { label: 'Home', value: '+61255504321' }),
      h(TelephoneNumberDisplay, { label: 'Mobile', value: '0491570156', asLink: true }),
      h(TelephoneNumberDisplay, { label: 'Clinic', value: '1300975707' }),
      h(TelephoneNumberDisplay, { label: 'Next of Kin', value: '+64 21 123 4567' }))),
    regionCaption('NZ: NZ formats from E.164'),
    inRegion('NZ', h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, padding: 12, background: 'var(--surface)' } },
      h(TelephoneNumberDisplay, { label: 'Home', value: '+6433123456' }),
      h(TelephoneNumberDisplay, { label: 'Mobile', value: '0211234567', asLink: true })))
  )
);
</script>

</div>
</body>
</html>
