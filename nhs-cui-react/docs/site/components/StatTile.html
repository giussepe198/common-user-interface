<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatTile · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Data display</p>
<h1 style="margin:0 0 4px;font-size:20px">StatTile</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Stat tiles: number, trend in words, suppressed value · Guidelines: <code>src/data/StatTile/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { StatTile } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: 8 } },
    h(StatTile, { label: 'Referrals waiting', value: 42, trend: { direction: 'up', text: 'Up 6 since last week' }, note: 'North team', onOpen: () => {} }),
    h(StatTile, { label: 'Median wait', value: 12, unit: 'days', trend: { direction: 'down', text: 'Down 3 since September' }, asAt: '2026-10-28T09:00' }),
    h(StatTile, { label: 'Overdue reviews', value: 0, trend: { direction: 'same', text: 'No change since last week' } }),
    h(StatTile, { label: 'Seclusion episodes', value: null, suppressedText: 'Fewer than 5', note: 'Last 30 days' }))
);
</script>

</div>
</body>
</html>
