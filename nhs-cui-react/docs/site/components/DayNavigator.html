<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DayNavigator · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Drug administration</p>
<h1 style="margin:0 0 4px;font-size:20px">DayNavigator</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Day navigation: today selected, an earlier day selected with today still marked, calendar open · Guidelines: <code>src/administration/DayNavigator/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DayNavigator } = window.ClinicalCUI;
const TODAY = new Date(2026, 4, 27, 10, 20);
const label = function (t) { return h('div', { className: 'cui-label', style: { margin: '0 0 6px' } }, t); };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },
    h('div', null, label('Today selected (third, widest column)'), h(DayNavigator, { today: TODAY })),
    h('div', null, label('Tomorrow selected: today keeps its heading style'), h(DayNavigator, { today: TODAY, defaultSelectedDate: new Date(2026, 4, 28) })),
    h('div', { id: 'cal' }, label('Calendar open, with Go to today'), h(DayNavigator, { today: TODAY, defaultSelectedDate: new Date(2026, 4, 24) }))
  )
);
setTimeout(function () { const b = document.querySelector('#cal button[aria-haspopup="dialog"]'); if (b) b.click(); }, 30);
</script>

</div>
</body>
</html>
