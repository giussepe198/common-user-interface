<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TemplateReopenControl · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Medications</p>
<h1 style="margin:0 0 4px;font-size:20px">TemplateReopenControl</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Reopen template prescriptions; highlights the fields the template filled · Guidelines: <code>src/medications/TemplateReopenControl/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TemplateReopenControl } = window.ClinicalCUI;
function Demo(props) {
  const [hl, setHl] = React.useState(props.initial || []);
  const field = (id, text) => h('span', { className: hl.indexOf(id) >= 0 ? 'cui-template-defined' : '', style: { display: 'inline-block', padding: '5px 10px', border: '1px solid var(--border-strong)', borderRadius: 4, background: 'var(--surface)' } }, text);
  return h('div', { style: { display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' } },
    field('dose', 'DOSE 500 mg'), field('frequency', 'twice a day'), field('duration', 'duration 7 days'),
    h(TemplateReopenControl, { definedFieldIds: ['dose', 'frequency', 'duration'], fieldNames: { dose: 'Dose', frequency: 'Frequency', duration: 'Duration' }, appliedTemplate: props.applied, onOpen: () => {}, onHighlightChange: setHl }));
}
const block = (title, el) => h('div', { style: { marginBottom: 20 } }, h('div', { className: 'cui-label', style: { marginBottom: 6 } }, title), el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    block('Resting state (hover or focus the control to highlight the fields)', h(Demo, {})),
    block('While the control has focus: template-defined fields highlighted', h(Demo, { initial: ['dose', 'frequency', 'duration'], applied: 'DOSE 500 mg twice a day' }))
  )
);
</script>

</div>
</body>
</html>
