<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BreakGlassDialog · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:748px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">BreakGlassDialog</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Emergency access: reason, justification, time box and declaration · Guidelines: <code>src/mental-health/BreakGlassDialog/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root" style="position: relative; min-height: 700px;"></div>
<script>
const h = React.createElement;
const { BreakGlassDialog } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(BreakGlassDialog, {
    open: true, onClose: function () {}, onConfirm: function () {},
    reasons: [{ value: 'crisis', label: 'Crisis presentation' }, { value: 'ed', label: 'Emergency department attendance' }, { value: 'other', label: 'Other urgent care need' }],
    maximum: '12 hours',
    person: { name: 'NGUYEN, Thi Lan', identifiers: 'Born 12-Mar-1990 (36y), Sex Female, Record number 004512' },
    includesRestricted: true,
    stepUpNote: 'You will confirm it is you with your passkey.'
  })
);
</script>

</div>
</body>
</html>
