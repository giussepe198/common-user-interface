<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubList · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">SubList</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Sublist in a list cell: every item shown, one updated entry marked, removed items counted, empty · Guidelines: <code>src/lists/SubList/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SubList } = window.ClinicalCUI;
const cell = (title, child) => h('div', { style: { border: '1px solid var(--border-strong)', background: 'var(--surface)', width: 280 } },
  h('div', { style: { padding: '6px 12px', fontWeight: 600, background: 'var(--surface-muted)', borderBottom: '1px solid var(--border-strong)' } }, title), child);
function Demo() {
  const [updated, setUpdated] = React.useState([1]);
  return h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' } },
    cell('Outstanding tasks (bed 4)', h(SubList, { 'aria-label': 'Outstanding tasks for bed 4', items: ['Chest X-ray', 'Bloods: FBC, U&E, CRP', 'Physiotherapy review', 'Repeat lactate at 16:00', 'Fluid balance chart'], updatedIndexes: updated, onUnmarkItem: i => setUpdated(updated.filter(x => x !== i)), itemLabel: 'task' })),
    cell('Results (bed 5)', h(SubList, { items: ['Urinary antigens negative', 'Blood cultures: no growth at 48 hours'], removedCount: 3, itemLabel: 'result' })),
    cell('Alerts (bed 6)', h(SubList, { items: [] }))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
