<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalculatedValue · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">CalculatedValue</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Calculated scores: complete, partial and cannot be calculated, with details · Guidelines: <code>src/noting/CalculatedValue/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { CalculatedValue, OutOfRangeMarker } = window.ClinicalCUI;
const contributors = [
  { label: 'Respiration rate', value: 24, unit: '/min', section: 'Observations', fieldId: 'rr', outOfRange: 'high' },
  { label: 'Oxygen saturation', value: 93, unit: '%', section: 'Observations', fieldId: 'spo2', outOfRange: 'low' },
  { label: 'Systolic blood pressure', value: 118, unit: 'mmHg', section: 'Observations', fieldId: 'sbp' },
  { label: 'Level of consciousness', value: 'Alert', source: 'record' },
  { label: 'Temperature', section: 'Observations', fieldId: 'temp' },
];
function Demo() {
  React.useEffect(() => { setTimeout(() => { const b = document.querySelector('#first .cui-calculated-value__label'); if (b) b.click(); }, 30); }, []);
  const row = (child) => h('div', { style: { marginBottom: 12 } }, child);
  return h('div', null,
    row(h('span', null, 'Respiration rate ', h('strong', null, '24'), ' /min ', h(OutOfRangeMarker, { direction: 'high', showText: true }))),
    row(h(CalculatedValue, { label: 'Body mass index', value: 31.2, decimals: 1, unit: 'kg/m²', meaning: 'Obese', normalRange: { low: 18.5, high: 24.9 }, scoringSystem: 'Weight (kg) divided by height (m) squared' })),
    row(h(CalculatedValue, { label: 'Wells score', status: 'cannotCalculate', contributors: [{ label: 'Clinical signs of DVT', section: 'Examination', fieldId: 'dvt' }] })),
    h('div', { id: 'first', style: { marginBottom: 12 } }, h(CalculatedValue, { label: 'Early warning score', value: 5, status: 'partial', meaning: 'Medium risk: urgent review', scoringSystem: 'National Early Warning Score 2', contributors: contributors, onOpenDetails: function () {}, onNavigateToField: function () {} }))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
