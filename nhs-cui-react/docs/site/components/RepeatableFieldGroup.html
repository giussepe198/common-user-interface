<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepeatableFieldGroup · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">RepeatableFieldGroup</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Repeatable fields (experimental): sets labelled with time of entry, Add another beside the latest · Guidelines: <code>src/noting/RepeatableFieldGroup/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { RepeatableFieldGroup, FormField } = window.ClinicalCUI;
const now = new Date(2026, 9, 27, 15, 0);
function Demo() {
  const [sets, setSets] = React.useState([{ id: 'a', recordedAt: new Date(2026, 9, 26, 22, 10), pulse: '96', rr: '18' }, { id: 'b', recordedAt: new Date(2026, 9, 27, 8, 5), pulse: '88', rr: '16' }, { id: 'c', recordedAt: new Date(2026, 9, 27, 14, 32), pulse: '', rr: '' }]);
  return h(RepeatableFieldGroup, { label: 'Vital signs', now: now, instances: sets,
    onAdd: () => setSets(sets.concat([{ id: String(sets.length + 1), recordedAt: new Date(), pulse: '', rr: '' }])),
    renderInstance: (s) => h('div', { style: { display: 'flex', gap: 12 } },
      h(FormField, { label: 'Pulse', prompt: 'beats/min' }, h('input', { className: 'cui-noting-input', style: { width: 80 }, defaultValue: s.pulse })),
      h(FormField, { label: 'Resp rate', prompt: 'breaths/min' }, h('input', { className: 'cui-noting-input', style: { width: 80 }, defaultValue: s.rr }))) });
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
