<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinicalStatement · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">ClinicalStatement</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Clinical statements (experimental): context first, coded and free text merged · Guidelines: <code>src/noting/ClinicalStatement/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalStatement } = window.ClinicalCUI;
const S = [
  { id: '1', pattern: 'PMH', observationTime: { year: 2008, month: 3 }, segments: [{ type: 'coded', text: 'Fracture of radius' }, { type: 'free', text: 'radius, fell off ladder' }] },
  { id: '2', pattern: 'FH', observationTime: { year: 1995, approximate: true }, segments: [{ type: 'coded', text: 'Myocardial infarction' }, { type: 'free', text: 'father died aged 55' }] },
  { id: '3', pattern: 'PMH', findingContext: 'knownAbsent', segments: [{ type: 'coded', text: 'Diabetes mellitus' }] },
  { id: '4', pattern: 'AAR', observationTime: { year: 2019, month: 6, day: 14 }, segments: [{ type: 'coded', text: 'Penicillin' }, { type: 'free', text: 'widespread rash' }] },
  { id: '5', pattern: 'HCC', sessionTime: new Date(), author: 'Dr A Example', segments: [{ type: 'free', text: 'Decreasing exercise tolerance over 3 months' }] },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 720 } },
    S.map((s) => h(ClinicalStatement, { key: s.id, statement: s, inMixedList: true, onAddEncoding: function () {}, showProvenance: s.id === '5' })),
    h('div', { style: { marginTop: 12 } }, h(ClinicalStatement, { statement: S[0], highlightCoded: true, onEdit: function () {} }))
  )
);
</script>

</div>
</body>
</html>
