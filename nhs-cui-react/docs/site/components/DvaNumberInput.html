<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DvaNumberInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">DvaNumberInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">DVA file number (AU) with card type; format check is advisory · Guidelines: <code>src/patient/DvaNumberInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DvaNumberInput } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 40, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    h(DvaNumberInput, { defaultValue: 'nbur9080', defaultCardType: 'Gold' }),
    h(DvaNumberInput, { id: 'preview-dva-warn', defaultValue: 'ABUR9080', hint: '' }),
    h(DvaNumberInput, { showCardType: false, required: true, error: 'Enter the DVA file number' })
  )
);
setTimeout(() => { const el = document.getElementById('preview-dva-warn'); if (el) { el.focus(); el.blur(); } }, 30);
</script>

</div>
</body>
</html>
