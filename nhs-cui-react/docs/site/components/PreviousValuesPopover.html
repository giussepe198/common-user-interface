<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreviousValuesPopover · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">PreviousValuesPopover</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Previous values shown above a numeric field while it has focus · Guidelines: <code>src/noting/PreviousValuesPopover/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PreviousValuesPopover, FormField } = window.ClinicalCUI;
const now = new Date(); const d = (days, hh, mm) => { const x = new Date(now); x.setDate(x.getDate() - days); x.setHours(hh, mm, 0, 0); return x; };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 64, flexWrap: 'wrap', paddingTop: 96 } },
    h(FormField, { label: 'Systolic BP', labelPosition: 'left', labelWidth: '6em', prompt: 'mmHg', promptPlacement: 'right' },
      h(PreviousValuesPopover, { forceOpen: true, unit: 'mmHg', values: [{ value: 152, recordedAt: d(0, 8, 10) }, { value: 138, recordedAt: d(0, 14, 45) }, { value: 147, recordedAt: d(2, 9, 0) }, { value: 160, recordedAt: d(9, 9, 0) }] },
        h('input', { type: 'text', inputMode: 'numeric', style: { width: '6em' } }))),
    h(FormField, { label: 'Temperature', prompt: '°C', promptPlacement: 'right' },
      h(PreviousValuesPopover, { forceOpen: true, unit: '°C', decimals: 1, placement: 'beside', onOpenHistory: function () {}, values: [{ value: 37, recordedAt: d(1, 8, 0) }, { value: 38.4, recordedAt: d(3, 20, 0) }] },
        h('input', { type: 'text', inputMode: 'decimal', defaultValue: '37.9', style: { width: '6em' } }))),
    h(FormField, { label: 'Weight (no previous values)', prompt: 'kg', promptPlacement: 'right' },
      h(PreviousValuesPopover, { forceOpen: true, unit: 'kg', values: [] }, h('input', { type: 'text', style: { width: '6em' } })))
  )
);
</script>

</div>
</body>
</html>
