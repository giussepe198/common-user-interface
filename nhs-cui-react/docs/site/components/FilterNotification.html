<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilterNotification · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">FilterNotification</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Filtered notification above a table, with result tabs · Guidelines: <code>src/lists/FilterNotification/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FilterNotification } = window.ClinicalCUI;
const attributes = [
  { id: 'age', label: 'Age', dataType: 'integer', unit: 'years' },
  { id: 'news', label: 'NEWS2 score', dataType: 'integer' },
  { id: 'admitted', label: 'Admitted', dataType: 'date' },
];
function Demo() {
  const [view, setView] = React.useState('in');
  return h('div', { style: { display: 'grid', gap: 16 } },
    h(FilterNotification, { attributes, onRemoveAll: () => {}, filter: { combine: 'or', criteria: [{ attributeId: 'news', operator: 'greaterThanOrEqual', value: '5' }, { attributeId: 'admitted', operator: 'between', value: '2026-10-26', value2: '2026-10-27' }] }, counts: { in: 4, out: 26, all: 30 }, view, onViewChange: setView, rowNoun: 'patients' }),
    h(FilterNotification, { attributes, onRemoveAll: () => {}, filter: { combine: 'and', criteria: [{ attributeId: 'age', operator: 'greaterThan', value: '65' }, { attributeId: 'news', operator: 'lessThan', value: '3' }] } })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
