<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PartialDateOfBirthInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">PartialDateOfBirthInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Date of birth with partial dates (NZ, HISO 10046 YYYY[MM[DD]]) · Guidelines: <code>src/patient/PartialDateOfBirthInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PartialDateOfBirthInput, ClinicalLocaleProvider } = window.ClinicalCUI;
const now = new Date(2026, 9, 27);
const caption = (t) => h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)', marginBottom: 6 } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h(ClinicalLocaleProvider, { region: 'NZ' },
    h('div', { style: { display: 'flex', gap: 40, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
      h('div', null, caption('Year only'), h(PartialDateOfBirthInput, { defaultValue: '1975', now })),
      h('div', null, caption('Month and year, with source'), h(PartialDateOfBirthInput, { defaultValue: '197503', showSource: true, defaultSource: 'NPRF', now })),
      h('div', { id: 'preview-dob-bad' }, caption('Day without month (error)'), h(PartialDateOfBirthInput, { id: 'preview-dob-bad-input', now, error: 'A day can only be entered when the month is known' }))
    )
  )
);
setTimeout(() => {
  const d = document.getElementById('preview-dob-bad-input-day');
  if (d) {
    const set = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
    set.call(d, '4'); d.dispatchEvent(new Event('input', { bubbles: true }));
    const y = document.getElementById('preview-dob-bad-input-year');
    set.call(y, '1975'); y.dispatchEvent(new Event('input', { bubbles: true }));
  }
}, 30);
</script>

</div>
</body>
</html>
