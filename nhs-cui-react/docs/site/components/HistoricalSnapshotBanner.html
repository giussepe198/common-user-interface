<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HistoricalSnapshotBanner · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">HistoricalSnapshotBanner</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Historical view banner: word Historical, emphasised time, return to current; tag in a heading; unknown time · Guidelines: <code>src/lists/HistoricalSnapshotBanner/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { HistoricalSnapshotBanner } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gap: 16 } },
    h(HistoricalSnapshotBanner, { asAt: new Date(2026, 9, 26, 7, 30), subject: 'Ward 3 patient list', onReturnToCurrent: () => {} }),
    h('h2', { style: { margin: 0, fontSize: 18, display: 'flex', gap: 8, alignItems: 'center' } }, h(HistoricalSnapshotBanner, { variant: 'tag' }), 'Patient list for: Dr Okafor'),
    h(HistoricalSnapshotBanner, {})
  )
);
</script>

</div>
</body>
</html>
