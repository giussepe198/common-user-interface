<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullScreenSheet · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">FullScreenSheet</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Full-screen sheet: header with Cancel, scrolling body, bottom action bar · Guidelines: <code>src/touch/FullScreenSheet/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FullScreenSheet, ActionBar } = window.ClinicalCUI;
function Demo() {
  const [open, setOpen] = React.useState(true);
  const card = (title, body) => h('section', { style: { background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4, padding: '12px 14px', margin: '16px 16px 0' } },
    h('h2', { style: { margin: '0 0 8px', fontSize: 13, color: 'var(--ink-muted)' } }, title), h('p', { style: { margin: 0 } }, body));
  return h('div', { style: { position: 'relative', height: 600, maxWidth: 390, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface-sunken)' } },
    h('div', { style: { padding: 16 } }, h('button', { type: 'button', className: 'cui-touch-button cui-touch-button--secondary cui-touch-button--h48', onClick: () => setOpen(true) }, 'Open full-screen sheet')),
    h(FullScreenSheet, {
      open, portal: false, autoFocus: false, closeOnBrowserBack: false, headingLevel: 1,
      title: 'When did the fall happen?', onClose: () => setOpen(false),
      footer: h(ActionBar, { sticky: false, layout: 'stack', summary: 'Mon 26-Oct-2026 Approx 21:30', actions: [{ label: 'Use this date and time', variant: 'primary', onClick: () => setOpen(false) }] })
    },
      card('Date', 'Mon 26-Oct-2026'),
      card('Time (24-hour)', 'Approx 21:30'),
      card('Where', 'Bathroom, bed 12'),
      card('Witnessed', 'No')
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
