<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatientIdentifierDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">PatientIdentifierDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Patient identifier display: label and format by type · Guidelines: <code>src/patient/PatientIdentifierDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PatientIdentifierDisplay } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 12, background: 'var(--surface)' } },
    h(PatientIdentifierDisplay, { type: 'nhs', value: '9990000018' }),
    h(PatientIdentifierDisplay, { type: 'ihi', value: '8003601234567894', ihiRecordStatus: 'Unverified' }),
    h(PatientIdentifierDisplay, { type: 'mrn', region: 'AU', value: '0042137' }),
    h(PatientIdentifierDisplay, { type: 'medicare', value: '2123456701', irn: '1' }),
    h(PatientIdentifierDisplay, { type: 'dva', value: 'NBUR9080', dvaCardType: 'Gold' }),
    h(PatientIdentifierDisplay, { type: 'nhi', value: 'ACA31FM' }),
    h(PatientIdentifierDisplay, { type: 'nhi', value: null }),
    h(PatientIdentifierDisplay, { type: 'medicare', value: '2123456701', irn: '1', medicareValidTo: '09/2026', now: new Date(2026, 9, 27) }),
    h(PatientIdentifierDisplay, { type: 'nhi', value: 'ZAC5361', flagTestNumbers: false, nhiStatus: 'dormant', liveNhi: 'ZBN77VL', onUseLiveNhi: () => {} })
  )
);
</script>

</div>
</body>
</html>
