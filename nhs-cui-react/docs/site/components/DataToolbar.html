<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataToolbar · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">DataToolbar</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Filter, Sort and Group by commands · Guidelines: <code>src/lists/DataToolbar/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DataToolbar } = window.ClinicalCUI;
const opts = [{ id: 'ward', label: 'Ward' }, { id: 'consultant', label: 'Consultant' }, { id: 'news', label: 'NEWS2 score' }];
function Demo() {
  const [g, setG] = React.useState('consultant');
  const [msg, setMsg] = React.useState('Press Alt+Shift+F, S or G');
  const box = c => h('div', { style: { padding: 8, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4 } }, c);
  return h('div', { style: { display: 'grid', gap: 12 } },
    box(h(DataToolbar, { label: 'Patient list tools', onFilter: () => setMsg('Filter dialog opened'), onSort: () => setMsg('Sort dialog opened'), groupOptions: opts, groupBy: g, onGroupByChange: setG, filterActive: true, onRemoveAllFilters: () => setMsg('Filters removed') })),
    box(h(DataToolbar, { label: 'Results tools', onFilter: () => {}, onSort: () => {}, groupOptions: opts, defaultGroupBy: null, keyboardShortcuts: false })),
    h('div', { className: 'cui-prompt', role: 'status' }, msg)
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
