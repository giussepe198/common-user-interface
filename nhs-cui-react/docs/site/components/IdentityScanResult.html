<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdentityScanResult · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile screens</p>
<h1 style="margin:0 0 4px;font-size:20px">IdentityScanResult</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Wristband scan result: match, mismatch with the band's patient, not scanned, nothing comparable · Guidelines: <code>src/mobile/IdentityScanResult/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { IdentityScanResult, ClinicalLocaleProvider } = window.ClinicalCUI;
const now = new Date(2026, 9, 27, 14, 6);
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 12, lineHeight: '16px', color: 'var(--ink-muted)' } }, t);
const frame = (child) => h('div', { style: { maxWidth: 390, border: '1px solid var(--border)', background: 'var(--surface)' } }, child);
const other = { name: { familyName: 'Smith', givenName: 'John' }, dateOfBirth: '1962-06-11', identifiers: [{ type: 'mrn', value: '0398812' }], location: 'Bed 3' };
ReactDOM.createRoot(document.getElementById('root')).render(
  h(ClinicalLocaleProvider, { region: 'AU' },
    label('Match (B2)'),
    frame(h(IdentityScanResult, { status: 'match', scannedAt: new Date(2026, 9, 27, 14, 6), matched: ['URN'] })),
    label('Mismatch: what differs and who the band belongs to'),
    frame(h(IdentityScanResult, { status: 'mismatch', scannedAt: now, differences: ['URN differs', 'Date of birth differs'], scannedPatient: other, now, onScan: () => {}, onSwitchToScanned: () => {} })),
    label('Not scanned yet'),
    frame(h(IdentityScanResult, { status: 'notScanned', onScan: () => {} })),
    label('Scanned, but nothing on the band could be compared'),
    frame(h(IdentityScanResult, { status: 'insufficient', scannedAt: now, onScan: () => {} }))
  )
);
</script>

</div>
</body>
</html>
