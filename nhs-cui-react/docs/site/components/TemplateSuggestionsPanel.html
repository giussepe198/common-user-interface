<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TemplateSuggestionsPanel · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">TemplateSuggestionsPanel</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Template suggestions (experimental): optional, linked to a trigger term, free-text triggering switch · Guidelines: <code>src/noting/TemplateSuggestionsPanel/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TemplateSuggestionsPanel } = window.ClinicalCUI;
const triggers = [
  { id: 'dvt', term: 'Deep vein thrombosis', source: 'encoded', templates: [{ id: 'wells', title: "Wells' score for DVT", additional: true }, { id: 'anticoag', title: 'Anticoagulation plan' }] },
  { id: 'abg', term: 'Arterial blood gas', source: 'free text', templates: [{ id: 'abgf', title: 'Arterial blood gas results' }] },
];
function Demo() {
  const [on, setOn] = React.useState(true);
  return h('div', { style: { display: 'flex', gap: 32, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(TemplateSuggestionsPanel, { triggers: triggers, onOpenTemplate: function () {}, freeTextTriggering: on, onFreeTextTriggeringChange: setOn }),
    h(TemplateSuggestionsPanel, { triggers: [{ id: 'x', term: 'Ingrown toenail', templates: [] }], onOpenTemplate: function () {} }),
    h(TemplateSuggestionsPanel, { triggers: [], onOpenTemplate: function () {} }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
