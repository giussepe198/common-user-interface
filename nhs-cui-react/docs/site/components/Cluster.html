<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Page layout</p>
<h1 style="margin:0 0 4px;font-size:20px">Cluster</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Horizontal groups that wrap; justify between for a footer · Guidelines: <code>src/shell/Cluster/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const C = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 'var(--font-size-label)', lineHeight: 'var(--line-height-label)', color: 'var(--ink-muted)' } }, t);
const frame = (w, hgt, child) => h('div', { style: { position: 'relative', maxWidth: w, height: hgt, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface)' } }, child);

ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
  label('Buttons, wrapping in 260 px'), h('div', { style: { maxWidth: 260 } }, h(C.Cluster, null, h(C.Button, null, 'Print'), h(C.Button, null, 'Export'), h(C.Button, null, 'Share'), h(C.Button, null, 'Archive'))),
  label('Justify between'), h(C.Cluster, { justify: 'between' }, h('span', null, '3 selected'), h(C.Cluster, { gap: 2 }, h(C.Button, null, 'Cancel'), h(C.Button, { variant: 'primary' }, 'Save leave')))
));
</script>

</div>
</body>
</html>
