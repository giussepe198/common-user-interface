<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiSelect · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Forms</p>
<h1 style="margin:0 0 4px;font-size:20px">MultiSelect</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Several choices as chips inside the box · Guidelines: <code>src/forms/MultiSelect/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FormField, MultiSelect } = window.ClinicalCUI;
const langs = [{ value: 'en', label: 'English' }, { value: 'mi', label: 'Te reo Māori', lang: 'mi' }, { value: 'zh', label: 'Mandarin' }, { value: 'ar', label: 'Arabic' }, { value: 'vi', label: 'Vietnamese' }];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 380 } },
    h(FormField, { label: 'Languages spoken' }, h(MultiSelect, { options: langs, defaultValue: [langs[0], langs[1], langs[2]] })),
    h(FormField, { label: 'Interpreter languages', error: 'Choose at least one language' }, h(MultiSelect, { options: langs, placeholder: 'Type to filter' }))
  )
);
</script>

</div>
</body>
</html>
