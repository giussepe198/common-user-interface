<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommandSearch · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Search</p>
<h1 style="margin:0 0 4px;font-size:20px">CommandSearch</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Global search panel: screens and people, keyboard first · Guidelines: <code>src/search/CommandSearch/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { CommandSearch } = window.ClinicalCUI;
const screens = [{ id: 'caseload', label: 'Caseload' }, { id: 'work', label: 'My work' }, { id: 'search', label: 'Find a person' }];
const people = [
  { id: 'p1', label: 'SMITH, John', description: 'Born 12-Mar-1980 (46y), Record number URN-000123', warning: 'Similar name: check the date of birth and record number' },
  { id: 'p2', label: 'SMYTHE, Jon', description: 'Born 01-Jul-1975 (51y), Record number URN-000456', warning: 'Similar name: check the date of birth and record number' },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { position: 'relative', height: 460, transform: 'translateZ(0)' } },
    h(CommandSearch, {
      initialQuery: 'smi',
      sources: [
        { id: 'screens', label: 'Screens', search: q => screens.filter(s => s.label.toLowerCase().includes(q.toLowerCase())) },
        { id: 'people', label: 'People', minChars: 2, search: () => people },
      ],
      onSelect: () => {},
      onClose: () => {},
      getTop: () => 0,
    })
  )
);
</script>

</div>
</body>
</html>
