<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TemplateSearch · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">TemplateSearch</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Template search (experimental): context filter, suggested and additional templates, metadata fly-out, section matches · Guidelines: <code>src/noting/TemplateSearch/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TemplateSearch } = window.ClinicalCUI;
const T = [
  { id: 'adm', title: 'General medical admission', generic: true, suggested: true, metadata: [{ label: 'Version', value: '3.2' }, { label: 'Sections', value: 'Presenting complaint, Past medical history, Chest examination' }, { label: 'Last used', value: '21-Oct-2026 for this patient' }],
    sections: [{ id: 'pc', title: 'Presenting complaint' }, { id: 'obs', title: 'Observations and findings', synonyms: ['o/e', 'examination'], children: [{ id: 'chest', title: 'Chest examination' }, { id: 'vs', title: 'Vital signs' }] }] },
  { id: 'cp', title: 'Chest pain assessment with risk stratification for acute coronary syndrome', contexts: ['Cardiology'], metadata: [{ label: 'Version', value: '1.4' }] },
  { id: 'chf', title: 'Chest physiotherapy referral', contexts: ['Respiratory'] },
  { id: 'wells', title: "Wells' score for pulmonary embolism", additional: true, contexts: ['Cardiology', 'Acute medicine'] },
  { id: 'pmh', title: 'Past medical history', abbreviations: ['PMH'], generic: true },
];
function Demo() {
  React.useEffect(() => {
    setTimeout(() => {
      const set = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
      [['#a input[type=text]', 'chest'], ['#b input[type=text]', 'physio']].forEach(([sel, v]) => { const i = document.querySelector(sel); if (i) { set.call(i, v); i.dispatchEvent(new Event('input', { bubbles: true })); } });
      setTimeout(() => { const t = document.querySelector('#a .cui-template-search__title'); if (t) t.focus(); const e = document.querySelector('#a .cui-template-search__expand'); if (e) e.click(); }, 30);
    }, 60);
  }, []);
  return h('div', { style: { display: 'flex', gap: 48, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h('div', { id: 'a', style: { width: 720 } }, h(TemplateSearch, { templates: T, context: 'Cardiology', onSelect: function () {} })),
    h('div', { id: 'b' }, h(TemplateSearch, { templates: T, context: 'Cardiology', onSelect: function () {}, label: 'No matches with the filter on' })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
