<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Page layout</p>
<h1 style="margin:0 0 4px;font-size:20px">Stack</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Vertical spacing from the space tokens, no inline styles · Guidelines: <code>src/shell/Stack/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const C = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 'var(--font-size-label)', lineHeight: 'var(--line-height-label)', color: 'var(--ink-muted)' } }, t);
const frame = (w, hgt, child) => h('div', { style: { position: 'relative', maxWidth: w, height: hgt, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface)' } }, child);

const box = (t) => h('div', { style: { padding: 6, background: 'var(--surface-muted)' } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 32 } },
  h('div', null, label('gap 1 (4 px)'), h(C.Stack, { gap: 1 }, box('One'), box('Two'), box('Three'))),
  h('div', null, label('gap 3 (12 px)'), h(C.Stack, { gap: 3 }, box('One'), box('Two'), box('Three')))
));
</script>

</div>
</body>
</html>
