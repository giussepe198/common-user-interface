<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DragAndDrop · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Drag and drop</p>
<h1 style="margin:0 0 4px;font-size:20px">DragAndDrop</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Drag and drop primitives: a handle, the live announcement and a refusal, built with useDragAndDrop · Guidelines: <code>src/interaction/DragAndDrop/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { useDragAndDrop, DragHandle, DragAnnouncer, DragPreview, DropRefusal } = window.ClinicalCUI;
const places = ['Morning', 'Afternoon', 'Evening'];
function Demo() {
  const [at, setAt] = React.useState(0);
  const dnd = useDragAndDrop({
    origin: () => at,
    targetAt: (p) => { const el = document.elementFromPoint(p.x, p.y); const slot = el && el.closest('[data-slot]'); return slot ? Number(slot.dataset.slot) : null; },
    step: (from, key) => (key === 'right' || key === 'down' ? Math.min(2, from + 1) : key === 'left' || key === 'up' ? Math.max(0, from - 1) : null),
    canDrop: (_id, t) => (t === 2 ? 'the evening is closed' : true),
    itemWords: () => 'Phone call',
    targetWords: (t) => places[t],
    onDrop: (_id, t) => setAt(t),
  });
  const card = h('div', { 'data-drag-item': 'call', style: { display: 'flex', alignItems: 'center', gap: 8, padding: 8, background: 'var(--surface)', border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-md)' } },
    h(DragHandle, { bindings: dnd.handleProps('call'), label: 'Move Phone call' }), h('span', null, 'Phone call'));
  return h('div', null,
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: 12 } },
      places.map((p, i) => h('div', { key: p, 'data-slot': i, style: { minHeight: 120, padding: 8, background: 'var(--surface-sunken)', border: '1px ' + (dnd.drag && dnd.drag.target === i ? 'solid var(--accent)' : 'dashed var(--border-strong)'), borderRadius: 'var(--radius-md)' } },
        h('div', { className: 'cui-type-body-strong' }, p),
        dnd.drag && dnd.drag.target === i ? h('span', { className: 'cui-drop-label' + (dnd.drag.valid === true ? '' : ' cui-drop-label--refused') }, dnd.drag.valid === true ? 'Drop here' : 'Cannot drop here: ' + dnd.drag.valid) : null,
        at === i ? card : null))),
    dnd.refusal ? h(DropRefusal, { reason: dnd.refusal.reason }) : null,
    h('p', { className: 'cui-type-label', style: { color: 'var(--ink-muted)' } }, 'Last announcement: ', h('span', null, dnd.announcement || 'none yet')),
    h(DragPreview, { drag: dnd.drag }, 'Phone call'),
    h(DragAnnouncer, { announcement: dnd.announcement, instructionsId: dnd.instructionsId, instructions: dnd.words.instructions }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
