<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoldToConfirmButton · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">HoldToConfirmButton</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Hold to confirm (P4): hold 1.5 s, or tap or use a screen reader to confirm in a dialog · Guidelines: <code>src/touch/HoldToConfirmButton/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { HoldToConfirmButton, TouchButton } = window.ClinicalCUI;
const cap = t => h('p', { className: 'cui-label', style: { margin: '12px 0 4px' } }, t);
function Demo() {
  const [done, setDone] = React.useState('');
  return h('div', { style: { maxWidth: 390, display: 'flex', flexDirection: 'column', gap: 8 } },
    cap('Default: hold, or tap for the confirmation dialog'),
    h(HoldToConfirmButton, { actionLabel: 'Record 6 units given', confirmDescription: 'insulin aspart 6 units subcutaneous, SMITH, Jon', onConfirm: () => setDone('Recorded 6 units given') }),
    h(TouchButton, { fullWidth: true }, 'Not now'),
    done ? h('p', { role: 'status', style: { margin: 0, color: 'var(--success)', fontWeight: 600 } }, done) : null,
    cap('Disabled until the read-back matches'),
    h(HoldToConfirmButton, { actionLabel: 'Record 6 units given', onConfirm: () => undefined, disabled: true, hint: null })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
