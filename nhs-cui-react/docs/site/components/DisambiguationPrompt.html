<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DisambiguationPrompt · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Dates and times</p>
<h1 style="margin:0 0 4px;font-size:20px">DisambiguationPrompt</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Asks which date or duration was meant, at most two suggestions · Guidelines: <code>src/datetime/DisambiguationPrompt/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DisambiguationPrompt } = window.ClinicalCUI;
const noop = () => {};
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
    h(DisambiguationPrompt, { autoFocus: false, message: 'You entered "05/04/2009". The day and month could be either way round.', suggestions: [{ label: '05-Apr-2009', value: 1 }, { label: '04-May-2009', value: 2 }], onSelect: noop, onReenter: noop }),
    h(DisambiguationPrompt, { autoFocus: false, message: 'You entered "6m". "m" can mean months or minutes.', suggestions: [{ label: '6 months', value: 1 }, { label: '6 minutes', value: 2 }], reenterLabel: 'different duration', onSelect: noop, onReenter: noop }),
    h(DisambiguationPrompt, { autoFocus: false, message: 'You entered "5 April" without a year. Enter the full date including a four-digit year, e.g. 05-Apr-2026.', suggestions: [], reenterLabel: 'Re-enter the date', onSelect: noop, onReenter: noop })
  )
);
</script>

</div>
</body>
</html>
