<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconToolbar · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Display standards</p>
<h1 style="margin:0 0 4px;font-size:20px">IconToolbar</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Icon toolbar grouped by task, with selection-dependent commands · Guidelines: <code>src/datetime/IconToolbar/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { IconToolbar } = window.ClinicalCUI;
const groups = [
  { id: 'find', label: 'Find', items: [{ id: 'search', icon: 'search', label: 'Search', shortcut: 'Ctrl+F' }, { id: 'filter', icon: 'filter', label: 'Filter', pressed: true }] },
  { id: 'record', label: 'Patient record', items: [
    { id: 'add', icon: 'plus', label: 'Add patient', shortcut: 'Ctrl+N' },
    { id: 'edit', icon: 'pencil', label: 'Edit patient', requiresSelection: true },
    { id: 'delete', icon: 'trash', label: 'Delete patient', requiresSelection: true, meaning: 'error' },
  ] },
  { id: 'view', label: 'View', items: [{ id: 'refresh', icon: 'refresh', label: 'Refresh', shortcut: 'F5' }, { id: 'history', icon: 'history', label: 'History' }] },
];
function Demo() {
  const [sel, setSel] = React.useState(false);
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
    h(IconToolbar, { label: 'Patient list tools', groups, hasSelection: true }),
    h(IconToolbar, { label: 'Patient list tools, nothing selected', groups, hasSelection: sel, labels: 'hidden' }),
    h('div', { className: 'cui-label' }, 'Second toolbar: no patient selected, so Edit patient and Delete patient are unavailable (labels hidden, names in tooltips).')
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
