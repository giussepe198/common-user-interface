<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RestrictedContent · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:848px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">RestrictedContent</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Restricted content: masked, reason to reveal, opening recorded first · Guidelines: <code>src/mental-health/RestrictedContent/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { RestrictedContent } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12, padding: 16, background: 'var(--surface)' } },
    h(RestrictedContent, { label: 'Restricted: third-party information', onReveal: function () { return true; } }, 'Information given in confidence by a family member.'),
    h(RestrictedContent, { label: 'Restricted: family violence', onReveal: function () { return true; }, revealed: true }, 'Shown after the opening was recorded.')
  )
);
</script>

</div>
</body>
</html>
