<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TouchButton · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile touch inputs</p>
<h1 style="margin:0 0 4px;font-size:20px">TouchButton</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Touch buttons: 48, 56 and 64 px, variants, full width · Guidelines: <code>src/touch/TouchButton/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TouchButton } = window.ClinicalCUI;
const cap = t => h('p', { className: 'cui-label', style: { margin: '8px 0 4px' } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390, display: 'flex', flexDirection: 'column', gap: 8 } },
    cap('Variants, 56 px (commit size)'),
    h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
      h(TouchButton, { variant: 'primary' }, 'Record dose'),
      h(TouchButton, null, 'Not now'),
      h(TouchButton, { variant: 'danger', icon: 'trash' }, 'Remove')
    ),
    cap('48 px secondary actions, quiet, icon only'),
    h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' } },
      h(TouchButton, { size: 48, icon: 'chevron-left' }, 'Resp rate'),
      h(TouchButton, { size: 48, icon: 'chevron-right', iconPosition: 'end' }, 'Next: oxygen'),
      h(TouchButton, { size: 48, variant: 'quiet' }, 'Change'),
      h(TouchButton, { size: 48, iconOnly: true, icon: 'close' }, 'Close')
    ),
    cap('64 px full width, and disabled'),
    h(TouchButton, { size: 64, variant: 'primary', fullWidth: true }, 'Record 6 units given'),
    h(TouchButton, { fullWidth: true, disabled: true }, 'Record (complete the second check first)')
  )
);
</script>

</div>
</body>
</html>
