<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoMatchReport · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Terminology</p>
<h1 style="margin:0 0 4px;font-size:20px">NoMatchReport</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Report a missing term: describe, then check and send · Guidelines: <code>src/noting/NoMatchReport/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { NoMatchReport } = window.ClinicalCUI;
function Demo() {
  React.useEffect(() => { setTimeout(() => { const b = Array.from(document.querySelectorAll('#second button')).find((x) => x.textContent === 'Next'); if (b) b.click(); }, 60); }, []);
  return h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(NoMatchReport, { text: 'post covid brain fog', context: 'Problem list; no filter', onSubmit: function () {}, onCancel: function () {} }),
    h('div', { id: 'second' }, h(NoMatchReport, { text: 'ACL graft re-rupture', context: 'Past surgical history', onSubmit: function () {}, onCancel: function () {} })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
