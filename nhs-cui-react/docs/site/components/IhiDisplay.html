<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IhiDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">IhiDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">IHI display (AU) with status qualifiers in text · Guidelines: <code>src/patient/IhiDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { IhiDisplay } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 12, background: 'var(--surface)' } },
    h(IhiDisplay, { label: 'IHI', value: '8003601234567894', numberStatus: 'Active', recordStatus: 'Verified' }),
    h(IhiDisplay, { label: 'IHI', value: '8003601234567894', recordStatus: 'Unverified' }),
    h(IhiDisplay, { label: 'IHI', value: '8003601234567894', numberStatus: 'Deceased', recordStatus: 'Provisional' }),
    h(IhiDisplay, { label: 'IHI', value: '8003601234567895' }),
    h(IhiDisplay, { label: 'IHI', value: null })
  )
);
</script>

</div>
</body>
</html>
