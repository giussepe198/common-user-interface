<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EthnicityInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">EthnicityInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Ethnicity question (NZ, HISO 10001) with classification lookup · Guidelines: <code>src/patient/EthnicityInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { EthnicityInput } = window.ClinicalCUI;
// Consumer-supplied classification lookup (two illustrative entries; a real system queries the Stats NZ classification).
const classification = (q) => [{ code: '12948', label: 'Dutch' }, { code: '35111', label: 'Tokelauan' }]
  .filter((x) => x.label.toLowerCase().startsWith(q.toLowerCase()));
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 48, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    h(EthnicityInput, {
      classification,
      defaultValue: { entries: [{ code: '21111', label: 'Māori' }, { code: '31111', label: 'Samoan' }, { code: '35111', label: 'Tokelauan' }], otherText: 'Tokelauan' },
    }),
    h(EthnicityInput, { defaultValue: { entries: [{ code: '95555', label: 'I do not want to state my ethnicity' }] } })
  )
);
</script>

</div>
</body>
</html>
