<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicButton · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile voice</p>
<h1 style="margin:0 0 4px;font-size:20px">MicButton</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Microphone button: idle, listening (pressed), processing, error and unavailable, and the 56 px size · Guidelines: <code>src/voice/MicButton/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MicButton } = window.ClinicalCUI;
const cell = (label, el) => h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, padding: 12, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4 } },
  el, h('span', { className: 'cui-label', style: { fontSize: 12, color: 'var(--ink-muted)' } }, label));
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 } },
    cell('Idle', h(MicButton, { status: 'idle' })),
    cell('Listening (pressed)', h(MicButton, { status: 'listening' })),
    cell('Processing', h(MicButton, { status: 'processing' })),
    cell('Error', h(MicButton, { status: 'error', errorMessage: 'Nothing was heard. Try again, closer to the microphone.' })),
    cell('Unavailable', h(MicButton, { status: 'unavailable' })),
    cell('56 px, Dictate more', h(MicButton, { status: 'idle', size: 56, startLabel: 'Dictate more' }))
  )
);
</script>

</div>
</body>
</html>
