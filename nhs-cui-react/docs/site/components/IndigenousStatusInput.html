<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>

<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">IndigenousStatusInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Indigenous status question (AU, METeOR 602543) · Guidelines: <code>src/patient/IndigenousStatusInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { IndigenousStatusInput } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 48, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    h(IndigenousStatusInput, { purpose: 'Asked of everyone, to plan culturally safe care and services.' }),
    h(IndigenousStatusInput, { defaultValue: '3', showBothInstruction: false }),
    h(IndigenousStatusInput, { variant: 'interviewer', defaultValue: '1' }),
    h(IndigenousStatusInput, { variant: 'interviewer', personName: 'the person', includeBoth: false })
  )
);
</script>

</div>
