<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormField · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">FormField</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Field label, prompt placement, required, missed and error states · Guidelines: <code>src/noting/FormField/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FormField, RequiredKey } = window.ClinicalCUI;
function Demo() {
  const [sys, setSys] = React.useState('142');
  return h('div', { style: { maxWidth: 640 } },
    h(FormField, { label: 'Systolic blood pressure', labelPosition: 'left', required: true, prompt: 'mmHg', promptPlacement: 'right' },
      h('input', { type: 'text', inputMode: 'numeric', value: sys, onChange: (e) => setSys(e.target.value), style: { width: '6em' } })),
    h(FormField, { label: 'Respiration rate', labelPosition: 'left', required: true, missed: true, prompt: 'Breaths per minute', promptPlacement: 'right' },
      h('input', { type: 'text', inputMode: 'numeric', style: { width: '6em' } })),
    h(FormField, { label: 'Presenting complaint', labelPosition: 'left', prompt: 'Describe in the patient’s own words', promptPlacement: 'in-field' },
      h('input', { type: 'text', style: { width: '24em' } })),
    h(FormField, { label: 'Temperature', labelPosition: 'left', required: true, error: '398 is outside the expected range (25 to 45 °C). Check the decimal point.', prompt: '°C', promptPlacement: 'right' },
      h('input', { type: 'text', defaultValue: '398', style: { width: '6em' } })),
    h(FormField, { label: 'Social history', labelPosition: 'left', prompt: 'Include occupation and who the patient lives with' },
      h('textarea', { rows: 2, style: { width: '24em' } })),
    h(RequiredKey)
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
