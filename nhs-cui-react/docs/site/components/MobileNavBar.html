<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobileNavBar · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:438px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mobile screens</p>
<h1 style="margin:0 0 4px;font-size:20px">MobileNavBar</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">App navigation bar with a prominent centre Scan action · Guidelines: <code>src/mobile/MobileNavBar/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MobileNavBar } = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 12, lineHeight: '16px', color: 'var(--ink-muted)' } }, t);
const items = [
  { id: 'worklist', label: 'Worklist', icon: 'tick', badge: 3, badgeLabel: '3 due now' },
  { id: 'patients', label: 'Patients', icon: 'summary' },
  { id: 'dictate', label: 'Dictate', icon: 'dictate' },
  { id: 'handover', label: 'Handover', icon: 'handover' },
];
function Demo() {
  const [cur, setCur] = React.useState('worklist');
  const [n, setN] = React.useState(0);
  return h('div', null,
    h('div', { style: { maxWidth: 390, border: '1px solid var(--border)' } }, h(MobileNavBar, { items, current: cur, onSelect: setCur, onScan: () => setN(n + 1), sticky: false })),
    h('p', { role: 'status', style: { fontSize: 14, color: 'var(--ink-muted)' } }, n ? 'Scan started ' + n + ' time(s)' : 'Tap Scan to start a scan'));
}
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null, label('Worklist current (B1)'), h(Demo),
    label('Two destinations'), h('div', { style: { maxWidth: 390, border: '1px solid var(--border)' } }, h(MobileNavBar, { sticky: false, current: 'w', onScan: () => {}, items: [{ id: 'w', label: 'Worklist', icon: 'tick' }, { id: 'p', label: 'Patients', icon: 'summary' }] })))
);
</script>

</div>
</body>
</html>
