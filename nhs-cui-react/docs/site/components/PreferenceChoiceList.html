<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreferenceChoiceList · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Decision support</p>
<h1 style="margin:0 0 4px;font-size:20px">PreferenceChoiceList</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Choice list with preference ratings and the explanation window open · Guidelines: <code>src/administration/PreferenceChoiceList/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PreferenceChoiceList } = window.ClinicalCUI;
const link = function (t) { return h('a', { href: '#', onClick: function (e) { e.preventDefault(); } }, t); };
const options = [
  { id: 'aml', label: 'Amlodipine 5 mg tablets', preference: { level: 5, reasons: ['First line for this patient'] } },
  { id: 'lis', label: 'Lisinopril 2.5 mg tablets', preference: { level: 3, reasons: ['Check renal function first'] } },
  { id: 'aten', label: 'Atenolol 25 mg tablets', preference: { level: 1, reasons: ['Potential drug-drug interaction with Verapamil', 'Asthma recorded'],
    explanation: { summaries: [
      { text: h('span', null, 'Atenolol with ', link('Verapamil'), ' may cause bradycardia and heart block.'), source: 'Drug Interaction Checking' },
      { text: h('span', null, 'Beta-blockers can cause bronchospasm. ', link('Asthma'), ' is recorded for this patient.'), source: 'Drug to Disease Contraindications Checking' },
    ], actions: [{ id: 'x', label: 'Choose an alternative', preference: 5 }, { id: 'y', label: 'Continue with atenolol', preference: 1 }], details: { rationale: 'Both summaries apply to this option.' } } } },
  { id: 'oth', label: 'Other (search the formulary)' },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h(PreferenceChoiceList, { label: 'Antihypertensive', options: options, defaultValue: 'aml', onRecordResponse: function () {} })
);
setTimeout(function () { const b = document.querySelectorAll('.cui-ds-pref--button')[0]; if (b) b.click(); }, 30);
</script>

</div>
</body>
</html>
