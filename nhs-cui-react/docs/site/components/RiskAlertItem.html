<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiskAlertItem · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:848px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Mental health</p>
<h1 style="margin:0 0 4px;font-size:20px">RiskAlertItem</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Risk alert: category in words, CUI alert symbol, review date, never a number, never green · Guidelines: <code>src/mental-health/RiskAlertItem/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { RiskAlertItem } = window.ClinicalCUI;
const now = '2026-10-28T03:00:00Z';
const tz = 'Australia/Melbourne';
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 16, background: 'var(--surface)' } },
    h(RiskAlertItem, { alert: { id: '1', category: 'Safety to staff', severity: 'high', text: 'Two staff for home visits', reviewDue: '2026-12-01', recordedBy: 'J Clinician', recordedAt: '2026-09-01T00:00:00Z' }, needsAcknowledgement: true, onAcknowledge: function () {}, now: now, timeZone: tz }),
    h(RiskAlertItem, { alert: { id: '2', category: 'Risk to self', severity: 'moderate', levelLabel: 'High (clinician judgement)', text: 'Recent self-harm', reviewDue: '2026-10-01', recordedBy: 'K Nurse', recordedAt: '2026-07-01T00:00:00Z' }, now: now, timeZone: tz, onOpen: function () {} }),
    h(RiskAlertItem, { alert: { id: '3', category: 'Communication', severity: 'low', text: 'Uses a hearing aid', levelLabel: '7/10' }, now: now, timeZone: tz })
  )
);
</script>

</div>
</body>
</html>
