<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SensitiveCharacteristicDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">SensitiveCharacteristicDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Sensitive characteristic display (opt-in, hidden until shown) · Guidelines: <code>src/patient/SensitiveCharacteristicDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SensitiveCharacteristicDisplay, ClinicalLocaleProvider } = window.ClinicalCUI;
const caption = (t) => h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)', marginTop: 4 } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 12, background: 'var(--surface)' } },
    caption('AU'),
    h(ClinicalLocaleProvider, { region: 'AU' }, h(SensitiveCharacteristicDisplay, { enabled: true, topic: 'sexual-orientation', value: { code: '4', detail: 'Queer' } })),
    h(ClinicalLocaleProvider, { region: 'AU' }, h(SensitiveCharacteristicDisplay, { enabled: true, concealed: false, topic: 'variations-of-sex-characteristics', value: { code: '3' } })),
    caption('NZ'),
    h(ClinicalLocaleProvider, { region: 'NZ' }, h(SensitiveCharacteristicDisplay, { enabled: true, concealed: false, topic: 'sexual-orientation', value: { code: '03' } })),
    h(ClinicalLocaleProvider, { region: 'NZ' }, h(SensitiveCharacteristicDisplay, { enabled: true, topic: 'variations-of-sex-characteristics', value: null }))
  )
);
</script>

</div>
</body>
</html>
