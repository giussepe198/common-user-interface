<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NhsNumberDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">NhsNumberDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">NHS Number display in 3-3-4 groups · Guidelines: <code>src/patient/NhsNumberDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { NhsNumberDisplay } = window.ClinicalCUI;
const row = (child) => h('div', { style: { padding: '4px 0' } }, child);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { padding: 12, background: 'var(--surface)' } },
    row(h(NhsNumberDisplay, { value: '9990000018' })),
    row(h(NhsNumberDisplay, { label: 'NHS No.', value: '999 000 0026', definition: 'A ten-digit number used to identify a person uniquely within the NHS in England and Wales' })),
    row(h(NhsNumberDisplay, { label: 'NHS No.', value: '999000019' })),
    row(h(NhsNumberDisplay, { label: 'NHS No.', value: null }))
  )
);
</script>

</div>
</body>
</html>
