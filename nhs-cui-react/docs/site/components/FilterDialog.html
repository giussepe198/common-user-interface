<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilterDialog · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">FilterDialog</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Filter criteria builder: empty, and two criteria with OR / AND · Guidelines: <code>src/lists/FilterDialog/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FilterDialog } = window.ClinicalCUI;
const attributes = [
  { id: 'bed', label: 'Location', dataType: 'string' },
  { id: 'consultant', label: 'Consultant', dataType: 'unorderedSymbol', options: ['Dr Lindqvist', 'Dr Okafor'] },
  { id: 'age', label: 'Age', dataType: 'integer', unit: 'years' },
  { id: 'temp', label: 'Temperature', dataType: 'real', unit: '°C' },
  { id: 'avpu', label: 'AVPU', dataType: 'ordinal', options: ['Alert', 'Responds to voice', 'Responds to pain', 'Unresponsive'] },
  { id: 'admitted', label: 'Admitted', dataType: 'date' },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gap: 16 } },
    h(FilterDialog, { modal: false, tableName: 'ward patient list', rowNoun: 'patients', attributes, onOk: () => {}, onCancel: () => {}, onPreview: () => {} }),
    h(FilterDialog, { modal: false, tableName: 'ward patient list', rowNoun: 'patients', attributes, showOperatorSymbols: true, onOk: () => {}, onCancel: () => {}, onPreview: () => {},
      initial: { combine: 'or', criteria: [
        { attributeId: 'age', operator: 'greaterThanOrEqual', value: '65' },
        { attributeId: 'admitted', operator: 'between', value: '2026-10-20', value2: '2026-10-27' },
      ] } })
  )
);
</script>

</div>
</body>
</html>
