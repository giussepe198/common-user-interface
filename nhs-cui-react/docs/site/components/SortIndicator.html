<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortIndicator · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">SortIndicator</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Header sort indicator with progressive sort rank · Guidelines: <code>src/lists/SortIndicator/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SortIndicator } = window.ClinicalCUI;
const cell = (title, ind) => h('div', { style: { display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 8, width: 180, padding: '6px 8px', border: '1px solid var(--border-strong)', background: 'var(--surface-muted)', fontWeight: 600 } }, h('span', null, title), ind);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 12, flexWrap: 'wrap' } },
    cell('Admitted', h(SortIndicator, { direction: 'desc', orderLabel: 'Most recent first', attributeLabel: 'Admitted' })),
    cell('Consultant', h(SortIndicator, { direction: 'asc', rank: 1, orderLabel: 'A – Z', attributeLabel: 'Consultant' })),
    cell('Age (years)', h(SortIndicator, { direction: 'asc', rank: 2, orderLabel: 'Smallest first', attributeLabel: 'Age' }))
  )
);
</script>

</div>
</body>
</html>
