<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColumnChooser · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Lists and filtering</p>
<h1 style="margin:0 0 4px;font-size:20px">ColumnChooser</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Column chooser with locked key columns and role-based sets · Guidelines: <code>src/lists/ColumnChooser/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ColumnChooser } = window.ClinicalCUI;
const columns = [
  { id: 'bed', title: 'Location', locked: true },
  { id: 'patient', title: 'Patient', locked: true },
  { id: 'consultant', title: 'Consultant' },
  { id: 'age', title: 'Age' },
  { id: 'news', title: 'NEWS2 score' },
  { id: 'admitted', title: 'Admitted' },
  { id: 'problem', title: 'Working diagnosis' },
  { id: 'tasks', title: 'Outstanding tasks' },
];
const presets = [
  { id: 'fy1', label: 'Junior doctor', columnIds: ['consultant', 'news', 'problem', 'tasks'] },
  { id: 'nurse', label: 'Ward nurse', columnIds: ['news', 'tasks', 'admitted'] },
];
function Demo() {
  const [v, setV] = React.useState(['bed', 'patient', 'consultant', 'news', 'problem', 'tasks']);
  return h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(ColumnChooser, { columns, presets, value: v, onChange: setV }),
    h(ColumnChooser, { columns, presets, defaultValue: ['news', 'admitted', 'consultant'], title: 'Columns (custom)' })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
