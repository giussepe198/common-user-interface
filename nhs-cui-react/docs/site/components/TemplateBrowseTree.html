<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TemplateBrowseTree · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1248px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Clinical noting</p>
<h1 style="margin:0 0 4px;font-size:20px">TemplateBrowseTree</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Template browse tree (experimental): top-level sections, expand, addressed marks, open full form, hidden state · Guidelines: <code>src/noting/TemplateBrowseTree/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TemplateBrowseTree } = window.ClinicalCUI;
const S = [
  { id: 'pc', title: 'Presenting complaint' },
  { id: 'pmh', title: 'Past medical history' },
  { id: 'obs', title: 'Observations and findings', children: [{ id: 'vs', title: 'Vital signs', children: [{ id: 'bp', title: 'Blood pressure' }] }, { id: 'cvs', title: 'Cardiovascular examination' }] },
  { id: 'plan', title: 'Plan' },
];
function Demo() {
  React.useEffect(() => { setTimeout(() => { const b = document.querySelector('#a .cui-template-tree__expand'); if (b) b.click(); }, 60); }, []);
  return h('div', { style: { display: 'flex', gap: 32, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h('div', { id: 'a' }, h(TemplateBrowseTree, { sections: S, addressedIds: ['pc', 'pmh'], onOpenSection: function () {}, onOpenFullForm: function () {} })),
    h(TemplateBrowseTree, { sections: S, defaultOpen: false, onOpenSection: function () {} }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>

</div>
</body>
</html>
