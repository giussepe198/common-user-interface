<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedicareNumberInput · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:1048px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">MedicareNumberInput</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Medicare card number with IRN and valid to (AU) · Guidelines: <code>src/patient/MedicareNumberInput/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MedicareNumberInput } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 40, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    h(MedicareNumberInput, { defaultValue: '2123456701', defaultIrn: '1' }),
    h(MedicareNumberInput, { id: 'preview-medicare-bad', defaultValue: '2123456711', hint: '' }),
    h(MedicareNumberInput, { defaultValue: '2123456701', defaultIrn: '1', defaultValidTo: '06/2028', now: new Date(2026, 9, 27) }),
    h(MedicareNumberInput, { defaultValue: '2123456701', defaultIrn: '2', defaultValidTo: '09/2026', now: new Date(2026, 9, 27), hint: '' }),
    h(MedicareNumberInput, { defaultValue: '2123456701', defaultIrn: '3', defaultValidTo: '11/2026', now: new Date(2026, 9, 27), hint: '' })
  )
);
setTimeout(() => {
  ['preview-medicare-bad', 'preview-medicare-bad-irn'].forEach((id) => { const el = document.getElementById(id); if (el) { el.focus(); el.blur(); } });
}, 30);
</script>

</div>
</body>
</html>
