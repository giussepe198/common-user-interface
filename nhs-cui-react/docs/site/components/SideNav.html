<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideNav · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Application frame</p>
<h1 style="margin:0 0 4px;font-size:20px">SideNav</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Grouped destinations with icons and counts, current marked; collapsed icon rail · Guidelines: <code>src/shell/SideNav/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const C = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 'var(--font-size-label)', lineHeight: 'var(--line-height-label)', color: 'var(--ink-muted)' } }, t);
const frame = (w, hgt, child) => h('div', { style: { position: 'relative', maxWidth: w, height: hgt, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface)' } }, child);

const groups = [
  { id: 'work', label: 'Work', items: [
    { id: 'caseload', label: 'Caseload', href: '#c', icon: 'user' },
    { id: 'tasks', label: 'Tasks', href: '#t', icon: 'check', count: 4, countLabel: '4 open' },
    { id: 'notes', label: 'Notes', href: '#n', icon: 'pencil' },
  ] },
  { id: 'gov', label: 'Governance', items: [{ id: 'audit', label: 'Audit', href: '#a', icon: 'history' }, { id: 'kaupapa', label: 'Ratonga kaupapa Māori', href: '#k', lang: 'mi' }] },
];
const box = (w, c) => h('div', { style: { width: w, border: '1px solid var(--border)', background: 'var(--surface)' } }, c);
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 32, alignItems: 'flex-start', flexWrap: 'wrap' } },
  h('div', null, label('Expanded, Tasks current'), box(220, h(C.SideNav, { groups, current: 'tasks', onSelect: (id, e) => e.preventDefault(), header: h('strong', null, 'Riverside') }))),
  h('div', null, label('Icon rail'), box(48, h(C.SideNav, { groups, current: 'tasks', collapsed: true, onSelect: (id, e) => e.preventDefault() })))
));
</script>

</div>
</body>
</html>
