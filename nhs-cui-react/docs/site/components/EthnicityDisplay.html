<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EthnicityDisplay · Clinical CUI</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/clinical-cui.css">
<style>body{margin:0;background:var(--surface-sunken);color:var(--ink);font-family:var(--font-sans)}</style>
<script src="../assets/react.production.min.js"></script>
<script src="../assets/react-dom.production.min.js"></script>
<script src="../assets/clinical-cui.js"></script>
</head>
<body>
<div class="cui-root" style="padding:16px 24px;max-width:948px">
<p style="margin:0 0 4px;font-size:12px"><a href="../index.html" style="color:var(--accent)">Clinical CUI</a> · Patient identification</p>
<h1 style="margin:0 0 4px;font-size:20px">EthnicityDisplay</h1>
<p style="margin:0 0 16px;font-size:14px;color:var(--ink-muted)">Ethnicity display (NZ): all groups, recorded order, none marked main · Guidelines: <code>src/patient/EthnicityDisplay/README.md</code></p>
</div>
<div style="padding:0 24px 24px">
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { EthnicityDisplay } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 12, background: 'var(--surface)' } },
    h(EthnicityDisplay, { value: { entries: [{ code: '21111', label: 'Māori' }, { code: '31111', label: 'Samoan' }, { code: '11111', label: 'New Zealand European' }] } }),
    h(EthnicityDisplay, { value: { entries: [{ code: '43100', label: 'Indian' }, { code: '12948', label: 'Dutch' }], otherText: 'Dutch' } }),
    h(EthnicityDisplay, { value: { entries: [{ code: '94444', label: '' }] } }),
    h(EthnicityDisplay, { value: null }),
    h(EthnicityDisplay, { label: 'Ethnicity (level 1)', outputLevel: 1, value: { entries: [{ code: '21111', label: 'Māori' }, { code: '31111', label: 'Samoan' }, { code: '34111', label: 'Niuean' }, { code: '11111', label: 'New Zealand European' }] } }),
    h(EthnicityDisplay, { value: { entries: ['11111', '12100', '21111', '31111', '42100', '43100', '53111'].map((code) => ({ code, label: '' })) }, codeLabels: { '12100': 'British nfd', '53111': 'African' } })
  )
);
</script>

</div>
</body>
</html>
