<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Not given</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/clinicalcui/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.scr *{box-sizing:border-box}
.btn{min-height:56px;padding:0 16px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-family:inherit;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 16px;border-top:1px solid var(--border);cursor:pointer}
.opt input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.code{width:36px;height:36px;border:2px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
.sel{background:var(--accent-surface)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--banner); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 22px; overflow: hidden; position: relative">

  <div aria-hidden="true" style="height: 64px; padding: 12px 16px; color: var(--on-banner-muted); font-size: 14px; display: flex; align-items: center">CHEN, Wei · Bed 12 · paracetamol</div>

  <section role="dialog" aria-modal="true" aria-labelledby="ng-h" style="flex: 1; background: var(--surface); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 4px">
      <h1 id="ng-h" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">Why was it not given?</h1>
      <span style="font-size: 14px; color: var(--ink-muted)">CHEN, Wei · <strong style="color: var(--ink)">paracetamol</strong> 1 g, due 13:00</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column">
      <legend style="padding: 0 16px 6px; font-size: 13px; font-weight: 600; color: var(--ink-muted); letter-spacing: 0.02em">NIMC CODE</legend>
      <label class="opt"><input type="radio" name="r"><span class="code">A</span><span>Absent</span></label>
      <label class="opt"><input type="radio" name="r"><span class="code">F</span><span>Fasting</span></label>
      <label class="opt"><input type="radio" name="r"><span class="code">R</span><span>Refused</span></label>
      <label class="opt"><input type="radio" name="r"><span class="code">V</span><span>Vomiting</span></label>
      <label class="opt"><input type="radio" name="r"><span class="code">L</span><span>On leave</span></label>
      <label class="opt"><input type="radio" name="r"><span class="code">N</span><span>Not available</span></label>
      <label class="opt sel"><input type="radio" name="r" checked><span class="code" style="background: var(--ink); color: var(--surface)">W</span><span style="font-weight: 600">Withheld</span></label>
      <label class="opt"><input type="radio" name="r"><span class="code">S</span><span>Self administered</span></label>
    </fieldset>

    <div style="padding: 12px 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; background: var(--accent-surface)">
      <label for="why" style="font-weight: 600">Reason <span style="font-weight: 400; color: var(--ink-muted)">(required for W)</span></label>
      <textarea id="why" rows="2" style="font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface); color: var(--ink); resize: none">Temperature 36.9, patient comfortable. Will review at 16:00.</textarea>
      <span style="font-size: 13px; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 6px">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M9 4.5h6v9a3 3 0 0 1-6 0zM5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>Tap the field and speak, or type</span>
    </div>

    <div style="margin-top: auto; padding: 12px 16px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px">
      <a class="btn" href="B2-Administer.dc.html" style="flex: 1">Cancel</a>
      <button class="btn btn-p" type="button" style="flex: 1.6">Record W: Withheld</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
