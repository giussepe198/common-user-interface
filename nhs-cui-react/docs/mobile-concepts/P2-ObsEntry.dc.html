<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>Observation entry</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/clinicalcui/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.scr *{box-sizing:border-box}
.btn{min-height:52px;padding:0 16px;border-radius:4px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.key{min-height:60px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0}
.band{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;font-size:12px;line-height:15px;text-align:center;border-right:1px solid var(--surface)}
.z-no{background:var(--surface-muted);color:var(--ink)}
.z-ye{background:#ffff99;color:#1a2330}
.z-or{background:#ffe0ba;color:#1a2330}
.z-re{background:#ffc0d8;color:#1a2330}
[data-theme="dark"] .z-ye{background:#4a4712;color:#e8edf2}
[data-theme="dark"] .z-or{background:#57381a;color:#e8edf2}
[data-theme="dark"] .z-re{background:#5a2236;color:#e8edf2}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div class="scr" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 22px; overflow: hidden">

  <header aria-label="Patient" style="background: var(--banner); color: var(--on-banner); padding: 10px 16px; display: flex; flex-direction: column; gap: 2px">
    <div style="font-size: 17px; line-height: 22px; font-weight: 600">Ngata, Mereana (Ms)</div>
    <div style="display: flex; flex-wrap: wrap; column-gap: 10px; font-size: 13px; line-height: 18px">
      <span><span style="color: var(--on-banner-muted)">Born </span>14-Mar-1958 (68y)</span>
      <span><span style="color: var(--on-banner-muted)">NHI </span>ZZZ0016</span>
      <span style="background: var(--banner-alert); color: var(--banner); border-radius: 3px; padding: 0 6px; font-weight: 600">Allergies 2</span>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px; color: var(--ink-muted)">2 of 7 · NZEWS</span>
      <span style="font-size: 14px; color: var(--ink-muted)">Previous 93 % at 13:40</span>
    </div>
    <label for="v" style="font-size: 20px; line-height: 26px; font-weight: 600">Oxygen saturation</label>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <output id="v" style="font-size: 52px; line-height: 58px; font-weight: 700; font-variant-numeric: tabular-nums">84</output>
      <span style="font-size: 22px; color: var(--ink-muted)">%</span>
      <span class="z-re" style="margin-left: auto; align-self: center; font-size: 15px; font-weight: 700; padding: 4px 10px; border-radius: 4px">Score 3 · Red</span>
    </div>

    <div role="img" aria-label="Score bands: 96 or more scores 0, 94 to 95 scores 1, 92 to 93 scores 2, 91 or less scores 3. 84 is in the 91 or less band." style="display: flex; border-radius: 4px; overflow: hidden">
      <span class="band z-re" style="outline: 3px solid var(--ink); outline-offset: -3px; font-weight: 700">≤ 91<br>3</span>
      <span class="band z-or">92–93<br>2</span>
      <span class="band z-ye">94–95<br>1</span>
      <span class="band z-no">≥ 96<br>0</span>
    </div>

    <section role="alert" aria-labelledby="crit-h" style="border: 3px double var(--danger); background: var(--danger-surface); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
      <h2 id="crit-h" style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700; display: flex; gap: 8px; align-items: center">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--danger)"><path d="M12 19V5M6.5 13.5L12 19l5.5-5.5"/></svg>Below critical limit (85 %)</h2>
      <span style="font-size: 15px; line-height: 21px">Check the probe and the patient, then confirm. Escalate now if you are worried.</span>
      <div style="display: flex; gap: 8px">
        <button class="btn" type="button" style="flex: 1">Re-measure</button>
        <button class="btn btn-p" type="button" style="flex: 1">Confirm 84 %</button>
      </div>
    </section>

    <div role="group" aria-label="Number pad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: auto">
      <button class="key" type="button">1</button><button class="key" type="button">2</button><button class="key" type="button">3</button>
      <button class="key" type="button">4</button><button class="key" type="button">5</button><button class="key" type="button">6</button>
      <button class="key" type="button">7</button><button class="key" type="button">8</button><button class="key" type="button">9</button>
      <button class="key" type="button" aria-label="Decimal point">.</button><button class="key" type="button">0</button>
      <button class="key" type="button" aria-label="Delete last digit"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><path d="M9 6h11v12H9l-5-6zM12 9.5l5 5M17 9.5l-5 5"/></svg></button>
    </div>
  </main>

  <div style="padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px">
    <button class="btn" type="button" style="flex: 1"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6l6 6"/></svg>Resp rate</button>
    <button class="btn" type="button" style="flex: 1.3">Next: oxygen<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6l-6 6"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
