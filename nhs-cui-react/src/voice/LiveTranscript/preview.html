<!-- @dsCard group="Mobile voice" height=520 width=390 subtitle="Live transcript: recognised values highlighted, a teen or ty number to check, interim text while listening, and the empty state" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { LiveTranscript } = window.ClinicalCUI;
const mark = (text, words, kind) => words.map(w => { const s = text.indexOf(w); return { start: s, end: s + w.length, kind: kind || 'value' }; });
const t1 = "Resp rate twenty two, sats ninety three, BP one ten on seventy, heart rate one hundred and twelve, temp thirty eight point four, she's alert";
const t2 = 'Resp rate fifteen, sats ninety six on air';
const cap = t => h('p', { className: 'cui-label', style: { margin: '12px 0 4px', fontSize: 12, color: 'var(--ink-muted)' } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390 } },
    cap('Listening: values highlighted, interim text muted'),
    h(LiveTranscript, { text: t1, interim: 'on two', highlights: mark(t1, ['twenty two', 'ninety three', 'one ten on seventy', 'one hundred and twelve', 'thirty eight point four', 'alert']) }),
    cap('A number that could be fifteen or fifty is marked to check'),
    h(LiveTranscript, { text: t2, highlights: mark(t2, ['fifteen'], 'check').concat(mark(t2, ['ninety six', 'on air'])) }),
    cap('Nothing heard yet'),
    h(LiveTranscript, { text: '' })
  )
);
</script>
