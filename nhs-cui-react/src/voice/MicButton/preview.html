<!-- @dsCard group="Mobile voice" height=420 width=390 subtitle="Microphone button: idle, listening (pressed), processing, error and unavailable, and the 56 px size" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MicButton } = window.ClinicalCUI;
const cell = (label, el) => h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, padding: 12, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4 } },
  el, h('span', { className: 'cui-label', style: { fontSize: 12, color: 'var(--ink-muted)' } }, label));
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 } },
    cell('Idle', h(MicButton, { status: 'idle' })),
    cell('Listening (pressed)', h(MicButton, { status: 'listening' })),
    cell('Processing', h(MicButton, { status: 'processing' })),
    cell('Error', h(MicButton, { status: 'error', errorMessage: 'Nothing was heard. Try again, closer to the microphone.' })),
    cell('Unavailable', h(MicButton, { status: 'unavailable' })),
    cell('56 px, Dictate more', h(MicButton, { status: 'idle', size: 56, startLabel: 'Dictate more' }))
  )
);
</script>
