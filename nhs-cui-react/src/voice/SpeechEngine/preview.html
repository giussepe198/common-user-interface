<!-- @dsCard group="Mobile voice" height=560 width=390 subtitle="Speech engine adapter: a scripted engine driving the dictation hook (listening with results), an unavailable engine, and a permission error" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ScriptedSpeechEngine, useSpeechDictation, MicButton, LiveTranscript, ClinicalLocaleProvider } = window.ClinicalCUI;
function Demo({ engine, autoStart, title }) {
  const d = useSpeechDictation(engine);
  React.useEffect(() => { if (autoStart) d.start(); }, []);
  return h('section', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 12, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4, marginBottom: 12 } },
    h('h2', { style: { margin: 0, fontSize: 15, lineHeight: '20px' } }, title),
    h('div', { style: { display: 'flex', gap: 12, alignItems: 'center' } },
      h(MicButton, { status: d.status, onPress: d.toggle, errorMessage: d.error && d.error.message }),
      h('dl', { style: { margin: 0, fontSize: 14, lineHeight: '20px' } },
        h('dt', { style: { color: 'var(--ink-muted)' } }, 'Status'), h('dd', { style: { margin: 0, fontWeight: 600 } }, d.status),
        h('dt', { style: { color: 'var(--ink-muted)' } }, 'Language'), h('dd', { style: { margin: 0, fontWeight: 600 } }, engine && engine.lastStartOptions ? engine.lastStartOptions.language : 'not started'))),
    d.transcript || d.interim ? h(LiveTranscript, { text: d.transcript, interim: d.interim }) : null);
}
const scripted = new ScriptedSpeechEngine([{ final: 'Resp rate twenty two' }, { final: 'sats ninety three' }, { interim: ['BP one ten'] }], { playOnStart: true, endAfterScript: false });
const off = new ScriptedSpeechEngine([], { available: false });
const denied = new ScriptedSpeechEngine([{ error: 'not-allowed' }], { playOnStart: true });
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390 } },
    h(ClinicalLocaleProvider, { region: 'NZ' }, h(Demo, { engine: scripted, autoStart: true, title: 'NZ: scripted engine, listening (en-NZ)' })),
    h(Demo, { engine: off, title: 'No engine available: touch only' }),
    h(ClinicalLocaleProvider, { region: 'AU' }, h(Demo, { engine: denied, autoStart: true, title: 'AU: microphone permission refused' }))
  )
);
</script>
