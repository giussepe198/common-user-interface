<!-- @dsCard group="Forms" height=260 subtitle="Independent check boxes under one label" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { CheckboxGroup } = window.ClinicalCUI;
const opts = [{ value: 'phone', label: 'Phone' }, { value: 'sms', label: 'Text message' }, { value: 'email', label: 'Email' }, { value: 'post', label: 'Post', disabled: true }];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 460 } },
    h(CheckboxGroup, { label: 'Contact by', options: opts, defaultValue: ['sms'], prompt: 'Choose all that apply' }),
    h(CheckboxGroup, { label: 'Contact by', options: opts, orientation: 'horizontal', required: true, missed: true })
  )
);
</script>
