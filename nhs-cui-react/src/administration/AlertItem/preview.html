<!-- @dsCard group="Decision support" height=640 width=900 subtitle="Decision support alert: High Priority expanded with actions, Priority collapsed" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { AlertItem } = window.ClinicalCUI;
const at = function (hh, mm) { return new Date(2026, 4, 27, hh, mm); };
const link = function (t) { return h('a', { href: '#', onClick: function (e) { e.preventDefault(); } }, t); };
const high = {
  id: 'a1', status: 'High Priority', occurredAt: at(10, 47), source: 'Drug Interaction Checking',
  summary: h('span', null, 'There are potential additive hypotensive effects with Lisinopril and ', link('Furosemide'), ', a current medication for this patient.'),
  details: { patientSpecific: h('span', null, 'Last blood pressure 98/60 mmHg at 09:30.'), rationale: 'Both drugs lower blood pressure; combined use may cause hypotension.', references: 'Fictional formulary, section 2.5' },
  actions: [
    { id: 'r1', label: 'Reduce Furosemide dose', preference: 5, reasons: ['Potential drug-drug interaction with Furosemide'] },
    { id: 'r2', label: 'Monitor blood pressure', preference: 4, reasons: ['Low recent blood pressure', 'Age over 75'], subOptions: [{ id: 's1', label: 'Every 4 hours' }, { id: 's2', label: 'Every hour' }], subOptionMode: 'or' },
    { id: 'r3', label: 'Continue as prescribed', preference: 1, reasons: ['Interaction risk remains'] },
  ],
};
const pri = { id: 'a2', status: 'Priority', occurredAt: at(9, 15), source: 'Results Monitoring', summary: 'Creatinine has risen since the last result.' };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, maxWidth: 560 } },
    h(AlertItem, { alert: high, onRecordResponse: function () {}, onDismiss: function () {} }),
    h(AlertItem, { alert: pri })
  )
);
setTimeout(function () {
  const t = document.querySelector('.cui-ds-alert__actions-toggle');
  if (t) t.click();
}, 30);
</script>
