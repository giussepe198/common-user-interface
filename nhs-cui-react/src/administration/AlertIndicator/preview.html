<!-- @dsCard group="Decision support" height=160 width=1100 subtitle="Alert indicator: the five states" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { AlertIndicator } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center' } },
    h(AlertIndicator, { state: 'none' }),
    h(AlertIndicator, { state: 'priorityUnviewed', count: 2 }),
    h(AlertIndicator, { state: 'priorityViewed', count: 2 }),
    h(AlertIndicator, { state: 'highUnviewed', count: 3 }),
    h(AlertIndicator, { state: 'highViewed', count: 3 }),
    h(AlertIndicator, { state: 'highUnviewed', count: 3, showLabel: false })
  )
);
</script>
