<!-- @dsCard group="Decision support" height=760 width=1000 subtitle="Information window: explanation with two summaries and actions, Details tab, and alert header" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { InformationWindow } = window.ClinicalCUI;
const link = function (t) { return h('a', { href: '#', onClick: function (e) { e.preventDefault(); } }, t); };
const noop = function () {};
const summaries = [
  { text: h('span', null, 'There are potential additive hypotensive effects with Lisinopril and ', link('Furosemide'), ', a current medication for this patient.'), source: 'Drug Interaction Checking' },
  { text: 'The proposed dose is above the usual starting dose for a patient over 75.', source: 'Dose Checking' },
];
const actions = [
  { id: 'a1', label: 'Start at 2.5 mg once a day', preference: 5, reasons: ['Usual starting dose over 75'] },
  { id: 'a2', label: 'Monitor blood pressure', preference: 3, reasons: ['Low recent blood pressure'], subOptions: [{ id: 's1', label: 'Every 4 hours' }, { id: 's2', label: 'Daily' }], subOptionMode: 'or' },
  { id: 'a3', label: 'Prescribe as entered', preference: 1, reasons: ['Interaction risk remains', 'Dose above usual range'] },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 20, alignItems: 'flex-start', flexWrap: 'wrap' } },
    h(InformationWindow, { autoFocus: false, summaries: summaries, actions: actions, defaultActionsExpanded: true, onRecordResponse: noop, onDismiss: noop,
      details: { patientSpecific: 'Last blood pressure 98/60 mmHg at 09:30.', rationale: 'Both drugs lower blood pressure.', references: 'Fictional formulary, section 2.5' } }),
    h('div', { id: 'det', style: { maxWidth: '100%' } }, h(InformationWindow, { autoFocus: false, variant: 'alert', status: 'High Priority', occurredAt: new Date(2026, 4, 27, 10, 47), width: 380,
      summaries: [{ text: h('span', null, 'The ', link('potassium level'), ' is 7.7 mmol/L.'), source: 'Results Monitoring' }],
      details: { patientSpecific: 'Previous result 5.1 mmol/L on 25-May-2026.', rationale: 'Severe hyperkalaemia can cause arrhythmia.' }, onRecordResponse: noop, onDismiss: noop })),
    h('div', { id: 'kbd', style: { maxWidth: '100%' } },
      h('p', { className: 'cui-label', style: { margin: '0 0 4px' } }, 'Resized with the arrow keys on the grip (bottom right)'),
      h(InformationWindow, { autoFocus: false, width: 340, height: 240, summaries: [summaries[1]], onRecordResponse: noop, onDismiss: noop }))
  )
);
setTimeout(function () {
  const tab = Array.prototype.find.call(document.querySelectorAll('#det [role="tab"]'), function (x) { return x.textContent === 'Details'; });
  if (tab) tab.click();
}, 30);
setTimeout(function () {
  const grip = document.querySelector('#kbd .cui-ds-info__grip');
  if (!grip) return;
  ['ArrowRight', 'ArrowRight', 'ArrowDown'].forEach(function (k, i) { setTimeout(function () { grip.dispatchEvent(new KeyboardEvent('keydown', { key: k, shiftKey: true, bubbles: true })); }, 20 * i); });
}, 30);
</script>
