<!-- @dsCard group="Clinical noting" height=330 subtitle="Radio group: no default selection, revealing option prompt, missed state" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalRadioGroup } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 48, flexWrap: 'wrap' } },
    h('div', null,
      h(ClinicalRadioGroup, { legend: 'CVS normal on examination', required: true, options: [
        { value: 'yes', label: 'Yes' },
        { value: 'no', label: 'No', prompt: 'Opens further details: CVS examination', reveals: true },
      ] }),
      h(ClinicalRadioGroup, { legend: 'Smoking status', required: true, missed: true, options: [
        { value: 'never', label: 'Never smoked' },
        { value: 'ex', label: 'Ex-smoker' },
        { value: 'current', label: 'Current smoker' },
      ] })
    ),
    h('div', null,
      h(ClinicalRadioGroup, { legend: 'Laterality', orientation: 'horizontal', defaultValue: 'left', prompt: 'Required to code this finding', options: [
        { value: 'left', label: 'Left' }, { value: 'right', label: 'Right' }, { value: 'both', label: 'Both' }, { value: 'ns', label: 'Not specified' },
      ] }),
      h(ClinicalRadioGroup, { legend: 'Mobility before admission', error: 'Select an option to continue.', options: [
        { value: 'none', label: 'None of these', pinFirst: true },
        { value: 'indep', label: 'Independent' },
        { value: 'aid', label: 'Walks with aid' },
        { value: 'chair', label: 'Wheelchair user' },
      ] })
    )
  )
);
</script>
