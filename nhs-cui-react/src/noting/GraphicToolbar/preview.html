<!-- @dsCard group="Clinical noting" width=1200 height=200 subtitle="Graphic toolbar: grouped tools with labels and tooltips, undo, redo, remove all" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { GraphicToolbar, DEFAULT_GRAPHIC_SYMBOLS } = window.ClinicalCUI;
function Demo() {
  const [tool, setTool] = React.useState('symbol:x');
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
    h(GraphicToolbar, { tool: tool, onToolChange: setTool, symbols: DEFAULT_GRAPHIC_SYMBOLS, canUndo: true, canRedo: false, onUndo: function () {}, onRedo: function () {}, onDeleteSelected: function () {}, canDeleteSelected: true, onRemoveAll: function () {}, canRemoveAll: true, emphasis: { bold: true, underline: false, enabled: true }, onToggleEmphasis: function () {}, onRemoveModule: function () {} }),
    h(GraphicToolbar, { tool: 'select', onToolChange: function () {}, symbols: DEFAULT_GRAPHIC_SYMBOLS.slice(0, 1), canUndo: false, canRedo: false, onUndo: function () {}, onRedo: function () {}, onRemoveAll: function () {}, canRemoveAll: false })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
