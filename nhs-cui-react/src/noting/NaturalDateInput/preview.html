<!-- @dsCard group="Clinical noting" width=1200 height=600 subtitle="Natural-language duration and date entry with suggestions, From/To/For confirmation and date menu; AU and NZ" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { NaturalDateInput, ClinicalLocaleProvider } = window.ClinicalCUI;
const ref = new Date(2026, 9, 27);
const cell = (t, el) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 6, minWidth: 0 } }, h('p', { style: { margin: 0, fontSize: 12, fontWeight: 600, color: 'var(--ink-muted)' } }, t), el);
function Demo() {
  React.useEffect(() => {
    setTimeout(() => { const i = document.querySelector('#typing input'); if (i) { i.focus(); i.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true })); } }, 60);
  }, []);
  return h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px 40px', alignItems: 'start' } },
    cell('Exact phrase selected automatically', h(NaturalDateInput, { referenceDate: ref, defaultValue: 'past 10 years' })),
    cell('GB: ambiguous numeric date asks for a choice', h(NaturalDateInput, { referenceDate: ref, defaultValue: '05/04/2008' })),
    cell('With the date menu (CNA-0630) and an unrecognised phrase', h(NaturalDateInput, { referenceDate: ref, defaultValue: 'when the dog died', showDateMenu: true })),
    cell('AU: day first, southern seasons', h(ClinicalLocaleProvider, { region: 'AU' }, h(NaturalDateInput, { referenceDate: ref, defaultValue: 'summer 2019' }))),
    cell('NZ: day first, never month first', h(ClinicalLocaleProvider, { region: 'NZ' }, h(NaturalDateInput, { referenceDate: ref, defaultValue: '05/04/2008' }))),
    h('div', { id: 'typing', style: { minHeight: 240 } }, cell('Typing: suggestions below the field', h(NaturalDateInput, { referenceDate: ref, defaultValue: 'past 3' })))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
