<!-- @dsCard group="Clinical noting" height=260 subtitle="Section order (experimental): order added or standard order; items inside sections unchanged" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SectionOrderToggle, orderTemplateSections } = window.ClinicalCUI;
const added = [{ title: 'Plan' }, { title: 'Presenting complaint' }, { title: 'Past medical history' }, { title: 'Observations and findings' }];
function Demo() {
  const [mode, setMode] = React.useState('standard');
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
    h(SectionOrderToggle, { value: mode, onChange: setMode, standardLabel: 'Standard order (admission headings)' }),
    h('ol', { style: { margin: 0, paddingLeft: 20 } }, orderTemplateSections(added, mode).map((s) => h('li', { key: s.title }, s.title))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
