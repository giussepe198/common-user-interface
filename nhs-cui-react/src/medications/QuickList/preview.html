<!-- @dsCard group="Medications" width=1200 height=760 subtitle="Quick List on its own: description, shortcuts, change notice; AU and NZ names" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { QuickList, ClinicalLocaleProvider } = window.ClinicalCUI;
const g = (id, genericName, extra) => Object.assign({ id: id, genericName: genericName }, extra || {});
const general = [g('para', 'paracetamol'), g('amox', 'amoxicillin'), g('coam', 'co-amoxiclav', { ingredients: 'amoxicillin + clavulanic acid' }), g('amlo', 'amlodipine'),
  g('aten', 'atenolol'), g('furo', 'furosemide'), g('metf', 'metformin'), g('pred', 'prednisone'), g('oxy', 'oxycodone', { brandName: 'Oxycontin', misSelectionRisk: true }), g('enox', 'enoxaparin')];
const lists = [
  { id: 'gen', name: 'General Medicine', description: '10 commonly prescribed medications', items: general },
  { id: 'resp', name: 'Respiratory', description: '2 respiratory medications', items: [g('salb', 'salbutamol'), g('pred2', 'prednisolone')] }
];
const block = (title, el) => h('div', { style: { marginBottom: 20 } }, h('div', { className: 'cui-label', style: { marginBottom: 6 } }, title), el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, alignItems: 'start' } },
    block('GB: two lists, change notice beside the list (shortcuts off until closed)', h(QuickList, { lists: lists, selectedId: 'amox', changedOn: '2026-10-20', onSelect: () => {} })),
    h('div', null,
      block('AU: mixed-case lettering, brand in Title Case italic', h(ClinicalLocaleProvider, { region: 'AU' }, h(QuickList, { lists: lists.slice(0, 1), onSelect: () => {} }))),
      block('NZ: HQSC Tall Man lettering', h(ClinicalLocaleProvider, { region: 'NZ' }, h(QuickList, { lists: lists.slice(1), onSelect: () => {} }))))
  )
);
</script>
