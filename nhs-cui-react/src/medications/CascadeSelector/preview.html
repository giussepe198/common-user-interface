<!-- @dsCard group="Medications" width=1200 height=620 subtitle="Cascading route and form lists after drug selection, generic part above brand part" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { CascadeSelector, ClinicalLocaleProvider } = window.ClinicalCUI;
const tabletForms = { id: 'form', label: 'Form', options: [{ id: 'tab', label: 'tablet' }, { id: 'liq', label: 'oral liquid', supplementary: 'for swallowing difficulties' }] };
const diltiazem = {
  id: 'route', label: 'Route',
  options: [
    { id: 'g-oral', label: 'oral', drug: { genericName: 'diltiazem' }, kind: 'generic', next: tabletForms },
    { id: 'g-mr', label: 'oral – modified-release', drug: { genericName: 'diltiazem' }, kind: 'generic', next: { id: 'form', label: 'Form', options: [{ id: 'mrcap', label: 'modified-release capsule' }, { id: 'mrtab', label: 'modified-release tablet' }] } },
    { id: 'b-mr', label: 'oral – modified-release', drug: { genericName: 'diltiazem', brandName: 'Dilzem SR' }, kind: 'brand' }
  ]
};
const amio = {
  id: 'route', label: 'Route', options: [
    { id: 'oral', label: 'oral', drug: { genericName: 'amiodarone' }, kind: 'generic', next: tabletForms },
    { id: 'iv', label: 'intravenous', drug: { genericName: 'amiodarone' }, kind: 'generic' }
  ], otherLabel: 'specialist routes...'
};
const block = (title, el) => h('div', { style: { marginBottom: 20 } }, h('div', { className: 'cui-label', style: { marginBottom: 6 } }, title), el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    block('GB: brand selected, generic options first, "oral – modified-release" chosen, form list shown', h(CascadeSelector, { root: diltiazem, defaultValue: ['g-mr'] })),
    block('GB: route list only, nothing selected yet', h(CascadeSelector, { root: diltiazem })),
    block('AU: brand in Title Case italic, mixed-case lettering, custom "other" label', h(ClinicalLocaleProvider, { region: 'AU' }, h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap' } }, h(CascadeSelector, { root: diltiazem, defaultValue: ['b-mr'] }), h(CascadeSelector, { root: amio, defaultValue: ['oral', 'tab'] })))),
    block('NZ: HQSC Tall Man lettering', h(ClinicalLocaleProvider, { region: 'NZ' }, h(CascadeSelector, { root: amio, defaultValue: ['oral'] })))
  )
);
</script>
