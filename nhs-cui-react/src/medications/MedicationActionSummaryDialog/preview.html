<!-- @dsCard group="Medications" width=1200 height=760 subtitle="Summary of selected medications before an action on more than one (MEDv-203)" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MedicationActionSummaryDialog, ClinicalLocaleProvider } = window.ClinicalCUI;
const meds = [
  { id: '1', line: { genericName: 'amlodipine', form: 'tablet', dose: { value: 5, unit: 'mg' }, route: 'oral', frequency: 'once a day' }, status: 'Started', statusSupplement: 'Verified' },
  { id: '2', line: { genericName: 'metformin', brandName: 'Glucomet SR', form: 'modified-release tablet', dose: { value: 500, unit: 'mg' }, route: 'oral', frequency: 'twice a day', qualifiers: ['with food'] }, status: 'Started' },
  { id: '3', line: { genericName: 'prednisone', form: 'tablet', dose: { value: 40, unit: 'mg' }, route: 'oral', frequency: 'once a day', qualifiers: ['in the morning'] }, status: 'Suspended', suspendedOn: '2026-10-26' }
];
const block = (title, el) => h('div', { style: { marginBottom: 20 } }, h('div', { className: 'cui-label', style: { marginBottom: 6 } }, title), el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, alignItems: 'start' } },
    block('GB: suspend three medications (shown inline; normally a modal dialog)', h(MedicationActionSummaryDialog, { inline: true, actionLabel: 'Suspend', medications: meds, onConfirm: () => {}, onCancel: () => {} })),
    h('div', null,
      block('AU: discontinue, danger style, mixed-case lettering', h(ClinicalLocaleProvider, { region: 'AU' }, h(MedicationActionSummaryDialog, { inline: true, actionLabel: 'Discontinue', confirmVariant: 'danger', medications: meds.slice(0, 2), onConfirm: () => {}, onCancel: () => {} }))),
      block('NZ: verify', h(ClinicalLocaleProvider, { region: 'NZ' }, h(MedicationActionSummaryDialog, { inline: true, actionLabel: 'Verify', medications: meds.slice(1), onConfirm: () => {}, onCancel: () => {} }))))
  )
);
</script>
