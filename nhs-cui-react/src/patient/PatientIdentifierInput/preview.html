<!-- @dsCard group="Patient identification" width=1100 height=340 subtitle="Patient identifier input chosen by region and type" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PatientIdentifierInput, ClinicalLocaleProvider } = window.ClinicalCUI;
const cell = (t, child) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4 } },
  h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)' } }, t), child);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 32, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    cell('GB default', h(PatientIdentifierInput, { region: 'GB', defaultValue: '9990000018' })),
    cell('AU default (IHI)', h(ClinicalLocaleProvider, { region: 'AU' }, h(PatientIdentifierInput, { defaultValue: '8003601234567894' }))),
    cell('AU URN with a local pattern', h(PatientIdentifierInput, { region: 'AU', type: 'mrn', mrnPattern: /^\d{7}$/, hint: '7 digits', defaultValue: '0042137' })),
    cell('AU Medicare with IRN and valid to', h(PatientIdentifierInput, { region: 'AU', type: 'medicare', defaultValue: '2123456701', defaultIrn: '1', defaultValidTo: '06/2027', now: '2026-10-27' })),
    cell('NZ default (NHI)', h(ClinicalLocaleProvider, { region: 'NZ' }, h(PatientIdentifierInput, { defaultValue: 'ZBN77VL', flagTestNumbers: false }))),
    cell('NZ NHI with lookup (dormant)', h(PatientIdentifierInput, { region: 'NZ', required: true, defaultValue: 'ZAC5361', flagTestNumbers: false, lookupNhi: () => ({ status: 'dormant', liveNhi: 'ZBN77VL' }) })),
    cell('GB required', h(PatientIdentifierInput, { region: 'GB', required: true }))
  )
);
</script>
