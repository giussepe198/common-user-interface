<!-- @dsCard group="Patient identification" width=1200 height=1150 subtitle="My Health Record access states (AU): access code, emergency access, suspended" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MyHealthRecordStatus, ClinicalLocaleProvider } = window.ClinicalCUI;
const noop = () => {};
const col = (...kids) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, flex: '1 1 480px', minWidth: 0 } }, ...kids);
ReactDOM.createRoot(document.getElementById('root')).render(
  h(ClinicalLocaleProvider, { region: 'AU' },
    h('div', { style: { display: 'flex', gap: 24, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface-sunken)' } },
      col(
        h(MyHealthRecordStatus, { state: 'access-code-required', onSubmitAccessCode: noop, onEmergencyAccess: noop, doNotUpload: true }),
        h(MyHealthRecordStatus, { id: 'preview-mhr-emergency', state: 'restricted-documents', onSubmitAccessCode: noop, onEmergencyAccess: noop, onOpen: noop })
      ),
      col(
        h(MyHealthRecordStatus, { state: 'emergency-access', emergencyAccessFrom: new Date(2026, 9, 27, 14, 30), emergencyReason: 'Unconscious on arrival, no family present', onOpen: noop }),
        h(MyHealthRecordStatus, { state: 'suspended', onEmergencyAccess: noop }),
        h(MyHealthRecordStatus, { state: 'available', onOpen: noop, checkedAt: new Date(2026, 9, 27, 9, 12) }),
        h(MyHealthRecordStatus, { state: 'unavailable', onCheck: noop }),
        h(MyHealthRecordStatus, { state: 'cancelled' }),
        h('div', { style: { padding: 8, background: 'var(--surface)' } },
          h(MyHealthRecordStatus, { variant: 'compact', state: 'access-code-required', onEmergencyAccess: noop }),
          h(MyHealthRecordStatus, { variant: 'compact', state: 'no-record' }),
          h(MyHealthRecordStatus, { variant: 'compact', state: 'not-connected' }))
      )
    )
  )
);
setTimeout(() => {
  const root = document.getElementById('preview-mhr-emergency');
  const b = root && Array.from(root.querySelectorAll('button')).find((x) => x.textContent.trim() === 'Emergency access');
  if (b) b.click();
}, 30);
</script>
