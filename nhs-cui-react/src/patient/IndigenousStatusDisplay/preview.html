<!-- @dsCard group="Patient identification" height=144 subtitle="Indigenous status display (AU), never a bare code" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { IndigenousStatusDisplay } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 12, background: 'var(--surface)' } },
    h(IndigenousStatusDisplay, { value: '3' }),
    h(IndigenousStatusDisplay, { value: '1', variant: 'full', showCode: true }),
    h(IndigenousStatusDisplay, { value: '9' }),
    h(IndigenousStatusDisplay, { value: null })
  )
);
</script>
