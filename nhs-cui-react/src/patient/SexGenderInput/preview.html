<!-- @dsCard group="Patient identification" width=1000 height=819 subtitle="Current Gender and Sex input" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalLocaleProvider } = window.ClinicalCUI;
const regionCaption = (t) => h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)', margin: '12px 0 4px' } }, t);
const inRegion = (region, child, extra) => h(ClinicalLocaleProvider, Object.assign({ region }, extra || {}), child);
const { SexGenderInput } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    regionCaption('GB (NHS CUI)'),
  h('div', { style: { display: 'flex', gap: 40, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
    h(SexGenderInput, { kind: 'currentGender' }),
    h(SexGenderInput, { kind: 'sex', orientation: 'horizontal', error: "Select the patient's sex" }),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
      h(SexGenderInput, { kind: 'currentGender', variant: 'select', showDefinitions: false }),
      h(SexGenderInput, { kind: 'sex', variant: 'select', showDefinitions: false }))
  ),
    regionCaption('AU: ABS 2020 questions, codes and "please specify"'),
    inRegion('AU', h('div', { style: { display: 'flex', gap: 40, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
      h(SexGenderInput, { kind: 'sex', purpose: 'Asked because some reference ranges depend on it.' }),
      h(SexGenderInput, { defaultValue: '4', defaultDetail: 'genderqueer' }))),
    regionCaption('NZ: HISO 10046 gender with te reo Māori labels; Stats NZ sex at birth'),
    inRegion('NZ', h('div', { style: { display: 'flex', gap: 40, flexWrap: 'wrap', alignItems: 'flex-start', padding: 16, background: 'var(--surface)' } },
      h(SexGenderInput, { defaultValue: 'O', defaultDetail: 'non-binary' }),
      h(SexGenderInput, { kind: 'sex', variant: 'select' })), { teReoLabels: true })
  )
);
</script>
