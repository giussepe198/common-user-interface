<!-- @dsCard group="Patient identification" height=170 subtitle="Date of birth display with partial dates and age ranges (NZ)" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { PartialDateOfBirthDisplay, ClinicalLocaleProvider } = window.ClinicalCUI;
const now = new Date(2026, 9, 27);
ReactDOM.createRoot(document.getElementById('root')).render(
  h(ClinicalLocaleProvider, { region: 'NZ' },
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8, padding: 12, background: 'var(--surface)' } },
      h(PartialDateOfBirthDisplay, { value: '1975', now }),
      h(PartialDateOfBirthDisplay, { value: '197510', now, source: 'NPRF', showSource: true }),
      h(PartialDateOfBirthDisplay, { value: '19750314', now }),
      h(PartialDateOfBirthDisplay, { value: '197503', now, dateFormat: 'dd/mm/yyyy' }),
      h(PartialDateOfBirthDisplay, { value: null })
    )
  )
);
</script>
