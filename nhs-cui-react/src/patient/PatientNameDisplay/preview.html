<!-- @dsCard group="Patient identification" height=600 subtitle="FAMILY, Given (Title) name format" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalLocaleProvider } = window.ClinicalCUI;
const regionCaption = (t) => h('div', { style: { font: '600 12px/16px var(--font-sans)', color: 'var(--ink-muted)', margin: '12px 0 4px' } }, t);
const inRegion = (region, child, extra) => h(ClinicalLocaleProvider, Object.assign({ region }, extra || {}), child);
const { PatientNameDisplay } = window.ClinicalCUI;
const row = (child) => h('div', { style: { padding: '4px 0' } }, child);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    regionCaption('GB (NHS CUI)'),
  h('div', { style: { padding: 12, background: 'var(--surface)' } },
    row(h(PatientNameDisplay, { familyName: 'chandrasekhar', givenName: 'subramanyan', title: 'MR.', emphasis: true })),
    row(h(PatientNameDisplay, { familyName: 'Lidman-Sun-Dewar', givenName: 'Nis Bank', title: 'Dr' })),
    row(h(PatientNameDisplay, { familyName: 'Ruth', givenName: 'Anne', title: 'Mrs', showTitle: false })),
    h('div', { style: { width: 170, padding: '4px 0', borderTop: '1px solid var(--border)' } },
      h(PatientNameDisplay, { familyName: 'Treetawtchaiwong', givenName: 'Lertchai', title: 'Sir' })),
    row(h(PatientNameDisplay, { familyName: 'Smith', givenName: '' }))
  ),
    regionCaption('AU: family name upper case, no title, single name alone'),
    inRegion('AU', h('div', { style: { padding: 12, background: 'var(--surface)', display: 'flex', flexDirection: 'column', gap: 4 } },
      h(PatientNameDisplay, { familyName: "O'Brien", givenName: 'liam patrick', title: 'Mr', emphasis: true }),
      h(PatientNameDisplay, { familyName: 'Ngapanji', givenName: '' }),
      h(PatientNameDisplay, { familyName: 'Unknown', givenName: 'Male 3', unidentified: true }))),
    regionCaption('NZ: family name as recorded, macrons kept'),
    inRegion('NZ', h('div', { style: { padding: 12, background: 'var(--surface)', display: 'flex', flexDirection: 'column', gap: 4 } },
      h(PatientNameDisplay, { familyName: 'Te Huia', givenName: 'Kāhu', title: 'Ms', emphasis: true }),
      h(PatientNameDisplay, { familyName: 'Ngāwai', givenName: '' }),
      h(PatientNameDisplay, { familyName: 'Ngāwai', givenName: 'Aroha', familyNameCase: 'upper' }),
      h(PatientNameDisplay, { familyName: 'Parata', givenName: 'Hine', nameProtected: true }),
      h(PatientNameDisplay, { familyName: 'Parata', givenName: 'Hine', nameProtected: true, protectedDisplay: 'masked', onRevealProtected: () => {} })))
  )
);
</script>
