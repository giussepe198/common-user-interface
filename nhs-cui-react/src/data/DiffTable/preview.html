<!-- @dsCard group="Data display" height=520 width=900 subtitle="Diff table: an amendment and a merge comparison, wide and narrow" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DiffTable } = window.ClinicalCUI;
const versions = [{ id: 'b', label: 'Before' }, { id: 'a', label: 'After (amended 29-Sep-2026 10:14)' }];
const rows = [
  { id: 't', label: 'Appointment time', values: ['10:00', '10:30'] },
  { id: 'l', label: 'Location', values: ['Clinic 2', 'Clinic 2'] },
  { id: 'i', label: 'Interpreter', values: [null, 'Arabic'] },
];
const merge = [
  { id: 'n', label: 'Name', values: ['CITIZEN, Alex', 'CITIZEN, Alex'] },
  { id: 'd', label: 'Date of birth', values: ['01-Jan-1980', '02-Jan-1980'], status: { text: 'Different: choose', icon: 'warning' } },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'grid', gap: 24 } },
    h(DiffTable, { caption: 'What changed in the amendment of 29-Sep-2026', versions, rows }),
    h('div', { style: { maxWidth: 360 } }, h(DiffTable, { caption: 'Records to compare (narrow)', versions: [{ id: 'k', label: 'Keep: TST-000184' }, { id: 'm', label: 'Merge in: TST-000233' }], rows: merge })))
);
</script>
