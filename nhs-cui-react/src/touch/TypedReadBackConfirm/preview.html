<!-- @dsCard group="Mobile touch inputs" height=460 width=390 subtitle="Typed read-back (P4): match, mismatch, unsafe trailing zero" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { TypedReadBackConfirm } = window.ClinicalCUI;
const card = c => h('section', { style: { maxWidth: 390, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4, padding: '12px 14px', marginBottom: 12 } }, c);
const expected = { value: 6, unit: 'units', unitAliases: ['unit'] };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    card(h(TypedReadBackConfirm, { label: 'Type the dose you are giving', expected, defaultValue: '6' })),
    card(h(TypedReadBackConfirm, { label: 'Type the dose you are giving', expected, defaultValue: '60' })),
    card(h(TypedReadBackConfirm, { label: 'Type the dose you are giving', expected, defaultValue: '6.0' }))
  )
);
</script>
