<!-- @dsCard group="Mobile touch inputs" height=300 width=390 subtitle="Segmented control: two views, three modes, visible label, disabled option" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SegmentedControl } = window.ClinicalCUI;
const cap = t => h('p', { className: 'cui-label', style: { margin: '12px 0 4px' } }, t);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { maxWidth: 390 } },
    cap('Two views (A3)'),
    h(SegmentedControl, { label: 'Show', defaultValue: 'current', options: [{ value: 'current', label: 'Current', count: 7 }, { value: 'past', label: 'Past' }] }),
    cap('Three modes with a visible label'),
    h(SegmentedControl, { label: 'Entry mode', labelVisible: true, defaultValue: 'type', size: 56, options: [
      { value: 'touch', label: 'Keypad' }, { value: 'type', label: 'Type' }, { value: 'voice', label: 'Speak' }
    ] }),
    cap('Disabled option'),
    h(SegmentedControl, { label: 'Which 02:30', defaultValue: 'first', options: [
      { value: 'first', label: 'First (AEDT)' }, { value: 'second', label: 'Second (AEST)', disabled: true }
    ] })
  )
);
</script>
