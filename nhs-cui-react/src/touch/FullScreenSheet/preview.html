<!-- @dsCard group="Mobile touch inputs" height=640 width=390 subtitle="Full-screen sheet: header with Cancel, scrolling body, bottom action bar" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FullScreenSheet, ActionBar } = window.ClinicalCUI;
function Demo() {
  const [open, setOpen] = React.useState(true);
  const card = (title, body) => h('section', { style: { background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 4, padding: '12px 14px', margin: '16px 16px 0' } },
    h('h2', { style: { margin: '0 0 8px', fontSize: 13, color: 'var(--ink-muted)' } }, title), h('p', { style: { margin: 0 } }, body));
  return h('div', { style: { position: 'relative', height: 600, maxWidth: 390, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface-sunken)' } },
    h('div', { style: { padding: 16 } }, h('button', { type: 'button', className: 'cui-touch-button cui-touch-button--secondary cui-touch-button--h48', onClick: () => setOpen(true) }, 'Open full-screen sheet')),
    h(FullScreenSheet, {
      open, portal: false, autoFocus: false, closeOnBrowserBack: false, headingLevel: 1,
      title: 'When did the fall happen?', onClose: () => setOpen(false),
      footer: h(ActionBar, { sticky: false, layout: 'stack', summary: 'Mon 26-Oct-2026 Approx 21:30', actions: [{ label: 'Use this date and time', variant: 'primary', onClick: () => setOpen(false) }] })
    },
      card('Date', 'Mon 26-Oct-2026'),
      card('Time (24-hour)', 'Approx 21:30'),
      card('Where', 'Bathroom, bed 12'),
      card('Witnessed', 'No')
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
