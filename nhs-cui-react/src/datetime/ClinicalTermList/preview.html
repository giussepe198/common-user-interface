<!-- @dsCard group="Display standards" height=520 width=1000 subtitle="Clinical term list: full terms, end truncation with symbols, identical truncations shown in full" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { ClinicalTermList } = window.ClinicalCUI;
const terms = [
  { id: '1', term: 'Asthma' },
  { id: '2', term: 'Chronic obstructive pulmonary disease with acute lower respiratory infection' },
  { id: '3', term: 'Fracture of neck of femur' },
  { id: '4', term: 'Type 2 diabetes mellitus with persistent microalbuminuria' },
  { id: '5', term: 'Hypertension' },
  { id: '6', term: 'Adverse reaction to 100 milligrams of aspirin taken within 1-24 hours' },
];
const twins = [
  { id: 'a', term: 'Closed fracture of shaft of left femur with displacement' },
  { id: 'b', term: 'Closed fracture of shaft of left femur without displacement' },
  { id: 'c', term: 'Sprain of ankle' },
];
const col = (node, w) => h('div', { style: { width: w, flex: 'none' } }, node);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 24, alignItems: 'flex-start', flexWrap: 'wrap' } },
    col(h(ClinicalTermList, { label: 'Problems (full terms, default)', items: terms, defaultValue: '2', maxHeight: 260 }), 300),
    col(h(ClinicalTermList, { label: 'Problems (truncated)', items: terms, truncation: 'end', defaultValue: '4' }), 300),
    col(h(ClinicalTermList, { label: 'Look-alike terms', items: twins, truncation: 'end' }), 280)
  )
);
</script>
