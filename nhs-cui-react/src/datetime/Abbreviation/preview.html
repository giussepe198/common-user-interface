<!-- @dsCard group="Display standards" height=170 subtitle="Abbreviation with a discoverable meaning" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { Abbreviation, ClinicalLocaleProvider } = window.ClinicalCUI;
function Demo() {
  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
    h('p', { style: { margin: 0 } }, 'Referred to ', h(Abbreviation, { short: 'ENT', expansion: 'Ears Nose and Throat', glossaryHref: '#glossary' }), ' clinic for review.'),
    h('p', { style: { margin: 0 } }, 'Weakness of ', h(Abbreviation, { short: 'Tib.Ant.', expansion: 'Tibialis Anterior' }), ' on the left.'),
    h(ClinicalLocaleProvider, { region: 'AU' }, h('p', { style: { margin: 0 } }, 'AU: verified against the ', h(Abbreviation, { short: 'IHI', expansion: 'Individual Healthcare Identifier' }), ' service.')),
    h('p', { style: { margin: 0, minHeight: 60 } }, 'Column header style: ', h(AbbrOpen))
  );
}
function AbbrOpen() {
  const ref = React.useRef(null);
  React.useEffect(() => { const b = ref.current && ref.current.querySelector('button'); if (b) b.click(); }, []);
  return h('span', { ref }, h(Abbreviation, { short: 'BMI', expansion: 'Body mass index', glossaryHref: '#glossary' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
