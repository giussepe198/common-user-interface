<!-- @dsCard group="Dates and times" height=230 subtitle="Date and time separated by a single space, with zones for AU and NZ" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DateTimeDisplay, ClinicalLocaleProvider } = window.ClinicalCUI;
const row = (label, node) => h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 16, alignItems: 'baseline', padding: '4px 0' } }, h('span', { className: 'cui-label', style: { width: 190, flex: 'none' } }, label), node);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    row('Default', h(DateTimeDisplay, { value: '2006-06-12T02:30:00' })),
    row('Day of week and seconds', h(DateTimeDisplay, { value: '2009-01-05T09:43:22', dayOfWeek: true, showSeconds: true })),
    row('Approximate time', h(DateTimeDisplay, { value: '2010-03-27T23:30:00', approximateTime: true })),
    row('Time not known', h(DateTimeDisplay, { value: '2010-03-27', timeUnknown: true })),
    row('Missing', h(DateTimeDisplay, { value: null })),
    h(ClinicalLocaleProvider, { region: 'AU', timeZone: 'Australia/Sydney' },
      row('AU: AEDT ends (first 02:30)', h(DateTimeDisplay, { value: new Date('2027-04-03T15:30:00Z'), showZone: 'auto', dayOfWeek: true })),
      row('AU: AEDT ends (second 02:30)', h(DateTimeDisplay, { value: new Date('2027-04-03T16:30:00Z'), showZone: 'auto', dayOfWeek: true })),
      row('AU: Brisbane from Sydney', h(DateTimeDisplay, { value: new Date('2026-12-03T00:15:00Z'), timeZone: 'Australia/Brisbane', showZone: 'auto', dayOfWeek: true }))),
    h(ClinicalLocaleProvider, { region: 'NZ', timeZone: 'Pacific/Chatham' },
      row('NZ: Chatham Islands', h(DateTimeDisplay, { value: new Date('2026-07-01T00:00:00Z'), showZone: true })))
  )
);
</script>
