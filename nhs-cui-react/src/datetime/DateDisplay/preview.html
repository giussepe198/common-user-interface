<!-- @dsCard group="Dates and times" height=350 subtitle="Short, long, ordinal, day of week, partial and unknown dates" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { DateDisplay, ClinicalLocaleProvider } = window.ClinicalCUI;
const row = (label, node) => h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 16, alignItems: 'baseline', padding: '4px 0' } }, h('span', { className: 'cui-label', style: { width: 190, flex: 'none' } }, label), node);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    row('Short (clinical)', h(DateDisplay, { value: '2008-04-05' })),
    row('Short with day of week', h(DateDisplay, { value: '2008-01-01', dayOfWeek: true })),
    row('Long (patient letters)', h(DateDisplay, { value: '2008-04-05', format: 'long' })),
    row('Long ordinal', h(DateDisplay, { value: '2008-01-22', format: 'long', ordinal: true })),
    row('Partial (month and year)', h(DateDisplay, { value: { kind: 'monthYear', year: 2005, month: 8 } })),
    row('Partial (year only)', h(DateDisplay, { value: { kind: 'year', year: 1994 } })),
    row('Missing date', h(DateDisplay, { value: null })),
    row('Missing, custom text', h(DateDisplay, { value: null, nullText: 'Not recorded' })),
    h(ClinicalLocaleProvider, { region: 'AU' }, row('AU: day of week (Thur)', h(DateDisplay, { value: '2026-03-05', dayOfWeek: true }))),
    h(ClinicalLocaleProvider, { region: 'NZ' }, row('NZ: day of week', h(DateDisplay, { value: '2026-03-05', dayOfWeek: true }))),
    h(ClinicalLocaleProvider, { region: 'AU' }, row('AU: long (Style Manual)', h(DateDisplay, { value: '2026-03-05', format: 'long' }))),
    h(ClinicalLocaleProvider, { region: 'AU' }, row('AU: long with day', h(DateDisplay, { value: '2026-03-05', format: 'long', dayOfWeek: true })))
  )
);
</script>
