<!-- @dsCard group="Mental health" width=900 height=900 subtitle="Measure profile: item bars for two occasions with values and change in words; one occasion; narrow" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MeasureProfile } = window.ClinicalCUI;
const items = Array.from({ length: 12 }, function (_, i) { return { id: 'i' + (i + 1), label: 'Item ' + (i + 1) + '' }; });
const inst = { id: 'ex', name: 'Clinician rated measure', items: items, maxMissingItems: 2,
  options: [0, 1, 2, 3, 4].map(function (v) { return { value: v, label: String(v) }; }).concat([{ value: 9, label: 'Not known', excludeFromTotal: true }]) };
const a = { id: 'a', label: 'Admission', date: '2026-08-12', answers: { i1: 4, i2: 2, i3: 9, i4: 1, i5: 3, i6: 0, i7: 2, i8: 3, i9: 2, i10: 1, i11: 0, i12: 2 } };
const b = { id: 'b', label: 'Review', date: '2026-10-20', answers: { i1: 1, i2: 2, i3: 0, i4: 1, i5: 1, i6: 0, i7: 3, i8: 1, i9: 1, i10: 1, i11: 0 } };
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, padding: 16, background: 'var(--surface)' } },
    h(MeasureProfile, { instrument: inst, occasions: [a, b], timeZone: 'Australia/Melbourne' }),
    h('div', { style: { maxWidth: 340 } }, h(MeasureProfile, { instrument: Object.assign({}, inst, { items: items.slice(0, 3) }), occasions: [a, b], caption: 'Narrow (first 3 items)' }))
  )
);
</script>
