<!-- @dsCard group="Mental health" height=150 subtitle="Legal status badge: current, unconfirmed, ended, none, historic (host words)" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { LegalStatusBadge } = window.ClinicalCUI;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8, padding: 16, background: 'var(--surface)' } },
    h(LegalStatusBadge, { state: 'current', label: 'Inpatient treatment order', detail: 'Ends 14-Nov-2026 17:00 AEDT' }),
    h(LegalStatusBadge, { state: 'unconfirmed', label: 'Treatment order', warning: 'Order may have expired, status not confirmed' }),
    h(LegalStatusBadge, { state: 'ended', label: 'Assessment order', detail: 'Ended 20-Oct-2026 09:00 AEDT' }),
    h(LegalStatusBadge, { state: 'none', label: 'No order recorded' }),
    h(LegalStatusBadge, { state: 'historic', label: 'Order under a previous Act', onOpen: function () {} }),
    h(LegalStatusBadge, { state: 'current', size: 'compact', label: 'Compulsory treatment order (example, NZ)' })
  )
);
</script>
