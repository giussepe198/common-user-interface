<!-- @dsCard group="Mental health" width=800 height=360 subtitle="Risk alert list: severity order, high always shown, 'and N more alerts', empty state" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { RiskAlertList } = window.ClinicalCUI;
const now = '2026-10-28T03:00:00Z';
const alerts = [
  { id: 'l1', category: 'Communication', severity: 'low', text: 'Hearing aid' },
  { id: 'm1', category: 'Risk to self', severity: 'moderate', text: 'Recent self-harm', reviewDue: '2026-11-20' },
  { id: 'h1', category: 'Safety to staff', severity: 'high', text: 'Two staff for home visits', reviewDue: '2026-10-01' },
  { id: 'm2', category: 'Risk from others', severity: 'moderate', text: 'Family violence' }
];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, padding: 16, background: 'var(--surface)' } },
    h(RiskAlertList, { alerts: alerts, maxVisible: 1, now: now, timeZone: 'Australia/Melbourne' }),
    h(RiskAlertList, { alerts: [], heading: 'Alerts (none recorded)' })
  )
);
</script>
