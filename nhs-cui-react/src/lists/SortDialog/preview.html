<!-- @dsCard group="Lists and filtering" height=560 subtitle="Progressive sort dialog with plain-language order words" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { SortDialog } = window.ClinicalCUI;
const attributes = [
  { id: 'bed', label: 'Location', dataType: 'string' },
  { id: 'consultant', label: 'Consultant', dataType: 'unorderedSymbol' },
  { id: 'age', label: 'Age', dataType: 'integer' },
  { id: 'admitted', label: 'Admitted', dataType: 'date' },
];
const hidden = [{ id: 'avpu', label: 'AVPU', dataType: 'ordinal', options: ['Alert', 'Responds to voice', 'Responds to pain', 'Unresponsive'] }];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'flex-start' } },
    h(SortDialog, { modal: false, tableName: 'ward patient list', rowNoun: 'patients', attributes, hiddenAttributes: hidden, onOk: () => {}, onCancel: () => {}, onPreview: () => {},
      initial: [{ attributeId: 'consultant', direction: 'asc' }, { attributeId: 'age', direction: 'asc' }, { attributeId: 'admitted', direction: 'desc' }] }),
    h(SortDialog, { modal: false, tableName: 'medications', rowNoun: 'medications', attributes, onOk: () => {}, onCancel: () => {} })
  )
);
</script>
