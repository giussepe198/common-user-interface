<!-- @dsCard group="Timeline and graphs" height=1500 width=900 subtitle="Early warning score summary: NZ red zone, GB NEWS2 incomplete, AU ADDS placeholder, NSW Between the Flags yellow zone" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { EarlyWarningScoreSummary, ClinicalLocaleProvider, EWS_NSW_BTF } = window.ClinicalCUI;
const time = new Date(2026, 9, 27, 2, 0);
const label = text => h('h3', { style: { margin: '16px 0 8px', fontSize: 15 } }, text);
const mods = [{ id: 'm1', parameterId: 'oxygenSaturation', from: 88, to: 93, score: 0, label: 'SpO2 88–92%', reason: 'COPD, target range agreed', authorisedBy: 'Dr R. Pōmare, ext 4410', startedAt: new Date(2026, 9, 26, 9), durationHours: 72, signed: true }];
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    label('NZ: NZEWS, a single red parameter triggers the red zone'),
    h(ClinicalLocaleProvider, { region: 'NZ' }, h(EarlyWarningScoreSummary, { modifications: mods, observation: { time, values: { respiratoryRate: 26, oxygenSaturation: 90, supplementalOxygen: 'air', heartRate: 96, systolicBloodPressure: 124, temperature: 37.6, consciousness: 'A' } } })),
    label('GB: NEWS2, incomplete set'),
    h(EarlyWarningScoreSummary, { observation: { time, values: { respiratoryRate: 22, heartRate: 112, temperature: 38.4, systolicBloodPressure: 104 } } }),
    label('AU: ADDS with placeholder scores'),
    h(ClinicalLocaleProvider, { region: 'AU' }, h(EarlyWarningScoreSummary, { observation: { time, values: { respiratoryRate: 26, oxygenSaturation: 94, oxygenFlow: 2, systolicBloodPressure: 118, heartRate: 104, temperature: 37.9, consciousness: 'A' } } })),
    label('AU NSW: Between the Flags (SAGO), Yellow Zone, verify locally'),
    h(ClinicalLocaleProvider, { region: 'AU' }, h(EarlyWarningScoreSummary, { definition: EWS_NSW_BTF, observation: { time, values: { respiratoryRate: 26, oxygenSaturation: 94, supplementalOxygen: 'none', systolicBloodPressure: 118, heartRate: 104, temperature: 37.9, consciousness: 'A' } } }))
  )
);
</script>
