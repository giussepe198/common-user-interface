<!-- @dsCard group="Lists and filtering" height=220 width=1000 subtitle="Filtered notification above a table, with result tabs" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { FilterNotification } = window.ClinicalCUI;
const attributes = [
  { id: 'age', label: 'Age', dataType: 'integer', unit: 'years' },
  { id: 'news', label: 'NEWS2 score', dataType: 'integer' },
  { id: 'admitted', label: 'Admitted', dataType: 'date' },
];
function Demo() {
  const [view, setView] = React.useState('in');
  return h('div', { style: { display: 'grid', gap: 16 } },
    h(FilterNotification, { attributes, onRemoveAll: () => {}, filter: { combine: 'or', criteria: [{ attributeId: 'news', operator: 'greaterThanOrEqual', value: '5' }, { attributeId: 'admitted', operator: 'between', value: '2026-10-26', value2: '2026-10-27' }] }, counts: { in: 4, out: 26, all: 30 }, view, onViewChange: setView, rowNoun: 'patients' }),
    h(FilterNotification, { attributes, onRemoveAll: () => {}, filter: { combine: 'and', criteria: [{ attributeId: 'age', operator: 'greaterThan', value: '65' }, { attributeId: 'news', operator: 'lessThan', value: '3' }] } })
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
