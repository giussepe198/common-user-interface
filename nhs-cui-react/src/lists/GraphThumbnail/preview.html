<!-- @dsCard group="Timeline and graphs" height=300 subtitle="Graph thumbnails: points with values outside the main view, dense line with zones" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { GraphThumbnail, ewsGraphZones, EWS_NZEWS } = window.ClinicalCUI;
const base = new Date(2026, 9, 26, 14, 0).getTime();
const at = hrs => new Date(base + hrs * 3600000);
const sparse = [{ id: 'hr', label: 'Heart rate', unit: 'beats/min', points: [[1, 92], [4, 104], [8, 118], [12, 134], [14, 152], [18, 168], [21, 128], [23, 112]].map(([t, v]) => ({ time: at(t), value: v })) }];
const dense = [{ id: 'hr2', label: 'Heart rate', unit: 'beats/min', points: Array.from({ length: 96 }, (_, i) => ({ time: at(i / 4), value: Math.round(95 + 40 * Math.sin(i / 9) + (i % 7)) })) }];
const box = (title, el) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4, fontSize: 12 } }, h('span', null, title), el);
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { style: { display: 'flex', gap: 48, alignItems: 'flex-start' } },
    box('Points, normal range', h(GraphThumbnail, { series: sparse, start: at(0), end: at(24), viewRange: { min: 40, max: 160 }, normalRange: { low: 60, high: 100 }, label: 'Heart rate', unit: 'beats/min' })),
    box('Dense: line only, NZEWS zones', h(GraphThumbnail, { series: dense, start: at(0), end: at(24), viewRange: { min: 60, max: 140 }, zones: ewsGraphZones(EWS_NZEWS, 'heartRate'), label: 'Heart rate', unit: 'beats/min' })),
    box('All in view', h(GraphThumbnail, { series: sparse, start: at(0), end: at(24), viewRange: { min: 40, max: 180 }, label: 'Heart rate' }))
  )
);
</script>
