<!-- @dsCard group="Feedback" height=300 subtitle="Toasts: success leaves by itself, warning and error stay until dismissed" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const C = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 'var(--font-size-label)', lineHeight: 'var(--line-height-label)', color: 'var(--ink-muted)' } }, t);
const frame = (w, hgt, child) => h('div', { style: { position: 'relative', maxWidth: w, height: hgt, overflow: 'hidden', transform: 'translateZ(0)', border: '1px solid var(--border)', background: 'var(--surface)' } }, child);

ReactDOM.createRoot(document.getElementById('root')).render(h(C.Stack, { gap: 2 },
  label('Success with action'), h(C.Toast, { tone: 'success', title: 'Task closed', action: { label: 'Undo', onAction: () => undefined }, onDismiss: () => undefined }),
  label('Info'), h(C.Toast, { title: 'New version available', description: 'Reload when you are ready.', onDismiss: () => undefined }),
  label('Error (never auto-dismissed)'), h(C.Toast, { tone: 'error', title: 'Letter not sent', description: 'The mail service did not answer.', onDismiss: () => undefined })
));
</script>
