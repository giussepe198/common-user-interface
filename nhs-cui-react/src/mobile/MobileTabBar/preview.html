<!-- @dsCard group="Mobile screens" height=300 width=390 subtitle="Patient record tab bar: 64 px tabs with labels, current tab marked, count badge" -->
<div id="root" class="cui-root"></div>
<script>
const h = React.createElement;
const { MobileTabBar } = window.ClinicalCUI;
const label = (t) => h('p', { style: { margin: '14px 0 6px', fontSize: 12, lineHeight: '16px', color: 'var(--ink-muted)' } }, t);
const items = [
  { id: 'summary', label: 'Summary', icon: 'summary' },
  { id: 'medicines', label: 'Medicines', icon: 'medicines', badge: 2, badgeLabel: '2 due' },
  { id: 'obs', label: 'Obs', icon: 'obs' },
  { id: 'notes', label: 'Notes', icon: 'notes' },
  { id: 'more', label: 'More', icon: 'dots' },
];
function Demo({ start }) {
  const [cur, setCur] = React.useState(start);
  return h('div', { style: { maxWidth: 390, border: '1px solid var(--border)' } }, h(MobileTabBar, { items, current: cur, onSelect: setCur, sticky: false }));
}
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', null,
    label('Summary current (A1)'), h(Demo, { start: 'summary' }),
    label('Medicines current, with 2 due'), h(Demo, { start: 'medicines' }),
    label('Three tabs'), h('div', { style: { maxWidth: 390, border: '1px solid var(--border)' } }, h(MobileTabBar, { sticky: false, current: 'a', items: [{ id: 'a', label: 'Current', icon: 'pill' }, { id: 'b', label: 'History', icon: 'history' }, { id: 'c', label: 'Alerts', icon: 'bell' }] }))
  )
);
</script>
